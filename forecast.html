<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>USA 7-Day Weather Forecast</title>
<!-- Include Chart.js for interactive popup graphs -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
    * { box-sizing: border-box; }
    body { font-family: 'Segoe UI', Arial, sans-serif; background:#0d0d0d; color:#fff; padding:20px; margin: 0; }
    h1 { text-align:center; margin-bottom:5px; font-size:32px; color: #f0f0f0; }
    .subtitle { text-align:center; color:#a0a0a0; font-size:14px; margin-bottom:20px; }

    /* Search Bar Styling */
    .search-container { display: flex; justify-content: center; gap: 10px; margin-bottom: 25px; }
    .search-input { 
        padding: 10px 16px; 
        font-size: 16px; 
        border-radius: 8px; 
        border: 1px solid #333; 
        background: #1c1c1c; 
        color: #fff; 
        width: 320px; 
        outline: none;
    }
    .search-input:focus { border-color: #00a8cc; }
    .search-btn { 
        padding: 10px 20px; 
        font-size: 16px; 
        border: none; 
        border-radius: 8px; 
        background: #00a8cc; 
        color: #fff; 
        font-weight: bold; 
        cursor: pointer; 
        transition: background .2s, transform 0.1s;
    }
    .search-btn:hover { background: #0082a3; }
    .search-btn:active { transform: scale(0.98); }

    .forecast-container { display:flex; flex-wrap:wrap; gap:18px; justify-content:center; }
    .day-card { 
        background:#1c1c1c; padding:18px; border-radius:14px; width:230px;
        box-shadow:0 4px 18px rgba(0,0,0,0.6); transition:transform .2s, border-color .2s; border: 1px solid #282828; 
        cursor: pointer; position: relative;
    }
    .day-card:hover { transform:translateY(-4px); border-color: #00a8cc; }
    .day-name { font-size:20px; text-align:center; margin-bottom:2px; font-weight:bold; color: #00a8cc; }
    .day-date { font-size:12px; color:#777; text-align:center; margin-bottom:10px; }
    
    /* Weather Icon Styling */
    .weather-icon-container { text-align: center; margin-bottom: 12px; }
    .weather-icon { width: 56px; height: 56px; object-fit: contain; }

    .section-title { font-size:11px; text-transform:uppercase; letter-spacing:1px; color:#777; margin-bottom:4px; }

    /* Values & Labels */
    .metric-val { font-size:24px; font-weight:bold; margin-bottom:2px; }
    .metric-sub { font-size:13px; font-weight: 500; margin-bottom:6px; }

    /* Bar Styling */
    .bar { height:8px; background:#2a2a2a; border-radius:4px; overflow:hidden; margin-bottom:12px; }
    .bar-fill { height:100%; border-radius:4px; transition:width .8s, background-color .8s; }

    .click-hint {
        font-size: 11px; text-align: center; color: #00a8cc; margin-top: 10px; text-transform: uppercase; letter-spacing: 0.5px;
    }

    /* Modal Styling for Graph */
    .modal-overlay {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(5px);
        display: none; justify-content: center; align-items: center; z-index: 1000;
    }
    .modal-content {
        background: #1c1c1c; border: 1px solid #333; border-radius: 16px;
        width: 90%; max-width: 750px; padding: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        position: relative;
    }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; flex-wrap: wrap; gap: 10px; }
    .modal-title { font-size: 20px; font-weight: bold; color: #fff; }
    .modal-close { font-size: 24px; color: #aaa; cursor: pointer; border: none; background: none; }
    .modal-close:hover { color: #fff; }
    .controls-container { display: flex; align-items: center; gap: 10px; }
    .chart-select {
        background: #2a2a2a; color: #fff; border: 1px solid #444; padding: 8px 12px;
        border-radius: 6px; font-size: 14px; outline: none; cursor: pointer;
    }
    .chart-container { position: relative; width: 100%; height: 330px; }
    .graph-confidence-bar {
        font-size: 12px; color: #aaa; background: #252525; padding: 8px 12px; border-radius: 6px;
        margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #333;
    }
    .graph-confidence-bar span { color: #00a8cc; font-weight: bold; }
</style>
</head>
<body>

<h1 id="locationTitle">7-Day Weather Forecast</h1>
<div class="subtitle" id="locationSub">Search any location to view high/low temperatures, sustained wind, and peak gusts</div>

<div class="search-container">
    <input type="text" id="searchInput" class="search-input" placeholder="Search location (e.g. Duluth, Minneapolis, Seattle...)">
    <button onclick="fetchForecast()" class="search-btn">Search</button>
</div>

<div class="forecast-container" id="forecastContainer"></div>

<!-- Modal Dialog for Graph Display -->
<div class="modal-overlay" id="chartModal">
    <div class="modal-content">
        <div class="modal-header">
            <div>
                <div class="modal-title" id="modalTitle">Hourly Forecast Graph</div>
                <div style="font-size: 13px; color: #888;" id="modalSubtitle">Detailed breakdown</div>
            </div>
            <div class="controls-container">
                <select id="metricSelector" class="chart-select" onchange="updateChartMetric()">
                    <option value="temp">Temperature (°F)</option>

                    <option value="gusts">Wind Gusts (mph)</option>
                </select>
                <button class="modal-close" onclick="closeModal()">&times;</button>
            </div>
        </div>
        <div class="graph-confidence-bar" id="graphConfidenceBar">
            Live Precision & Dynamic Confidence: <span id="modalConfVal">Calculating...</span>
        </div>
        <div class="chart-container">
            <canvas id="forecastChart"></canvas>
        </div>
    </div>
</div>

<script>
// GitHub repository base path for weather icons
const ICON_BASE_URL = "https://raw.githubusercontent.com/jace200677/real-forecast/main/weather/";

let currentLat = null;
let currentLon = null;
let activeHourlyData = null;
let activeDayDateStr = null;
let chartInstance = null;
let liveTimerInterval = null;

// Map WMO weather codes and custom conditions to repository icon filenames
function getWeatherIcon(weatherCode, conditionText) {
    if (conditionText) {
        const lowerCond = conditionText.toLowerCase();
        if (lowerCond.includes("storm")) {
            return ICON_BASE_URL + "Thunderstorms.png";
        }
        if (lowerCond.includes("windy")) {
            return ICON_BASE_URL + "windy.png";
        }
    }
    
    switch (weatherCode) {
        case 0:
            return ICON_BASE_URL + "Sunny.png";
        case 1:
            return ICON_BASE_URL + "Mostly%20sunny.png";
        case 2:
            return ICON_BASE_URL + "Partly%20Cloudy.png";
        case 3:
            return ICON_BASE_URL + "Cloudy.png";
        case 45:
        case 48:
            return ICON_BASE_URL + "foggy.png";
        case 51:
        case 53:
        case 55:
        case 61:
        case 63:
            return ICON_BASE_URL + "Light%20Rain.png";
        case 65:
        case 80:
        case 81:
        case 82:
            return ICON_BASE_URL + "Rainy.png";
        case 71:
        case 73:
        case 85:
            return ICON_BASE_URL + "Light%20snow.png";
        case 75:
        case 77:
        case 86:
            return ICON_BASE_URL + "Snowy.png";
        case 95:
        case 96:
        case 99:
            return ICON_BASE_URL + "Thunderstorms.png";
        default:
            return ICON_BASE_URL + "Mostly%20cloudy.png";
    }
}

// Apple Weather Smooth Temperature Color Scale Lerp (°F)
function hexToRgb(hex) {
    let bigint = parseInt(hex.replace('#',''), 16);
    return [(bigint >> 16) & 255, (bigint >> 8) & 255, bigint & 255];
}

function rgbToHex(r, g, b) {
    return "#" + ((1 << 24) + (Math.round(r) << 16) + (Math.round(g) << 8) + Math.round(b)).toString(16).slice(1);
}

function interpolateColor(color1, color2, factor) {
    let c1 = hexToRgb(color1);
    let c2 = hexToRgb(color2);
    let r = c1[0] + factor * (c2[0] - c1[0]);
    let g = c1[1] + factor * (c2[1] - c1[1]);
    let b = c1[2] + factor * (c2[2] - c1[2]);
    return rgbToHex(r, g, b);
}

const appleTempStops = [
    { temp: 10, color: "#1c3d5a" }, 
    { temp: 32, color: "#007aff" }, 
    { temp: 50, color: "#34c759" }, 
    { temp: 68, color: "#ffcc00" }, 
    { temp: 82, color: "#ff9500" }, 
    { temp: 95, color: "#ff3b30" }, 
    { temp: 105, color: "#af52de" }
];

function getTempColor(temp) {
    if (temp <= appleTempStops[0].temp) return appleTempStops[0].color;
    if (temp >= appleTempStops[appleTempStops.length - 1].temp) return appleTempStops[appleTempStops.length - 1].color;

    for (let i = 0; i < appleTempStops.length - 1; i++) {
        let lowStop = appleTempStops[i];
        let highStop = appleTempStops[i + 1];
        if (temp >= lowStop.temp && temp <= highStop.temp) {
            let factor = (temp - lowStop.temp) / (highStop.temp - lowStop.temp);
            return interpolateColor(lowStop.color, highStop.color, factor);
        }
    }
    return "#007aff";
}

// Apple Weather Smooth Wind & Gust Color Scale Lerp (mph)
const appleWindStops = [
    { speed: 0, color: "#30b0c7" },   
    { speed: 15, color: "#34c759" },  
    { speed: 30, color: "#ffcc00" },  
    { speed: 50, color: "#ff9500" },  
    { speed: 75, color: "#ff3b30" },  
    { speed: 100, color: "#af52de" }  
];

function getWindColor(speed) {
    if (speed <= appleWindStops[0].speed) return appleWindStops[0].color;
    if (speed >= appleWindStops[appleWindStops.length - 1].speed) return appleWindStops[appleWindStops.length - 1].color;

    for (let i = 0; i < appleWindStops.length - 1; i++) {
        let lowStop = appleWindStops[i];
        let highStop = appleWindStops[i + 1];
        if (speed >= lowStop.speed && speed <= highStop.speed) {
            let factor = (speed - lowStop.speed) / (highStop.speed - lowStop.speed);
            return interpolateColor(lowStop.color, highStop.color, factor);
        }
    }
    return "#30b0c7";
}

// Regional Weather Event Scenarios with Base Confidence Ratings (0.0 to 1.0)
const regionalEvents = [
    {
        date: "7/31/2026",
        regionKeywords: ["minnesota", "mn"],
        baseConfidence: 0.90,
        data: { high: 82, low: 64, wind: 38, gusts: 75, condition: "Storms Afternoon" }
    },
    {
        date: "8/2/2026",
        regionKeywords: ["washington", "wa"],
        baseConfidence: 0.85,
        data: { high: 50, low: 38, wind: 68, gusts: 105, condition: "Windy / High Winds >100mph" }
    },
    {
        date: "8/3/2026",
        regionKeywords: ["idaho", "id"],
        baseConfidence: 0.70,
        data: { high: 72, low: 48, wind: 20, gusts: 35, condition: "Windy / Moderate Winds" }
    },
    {
        date: "8/4/2026",
        regionKeywords: ["montana", "mt"],
        baseConfidence: 0.95,
        data: { high: 98, low: 70, wind: 52, gusts: 88, condition: "Windy / Hot & Strong Winds" }
    },
    {
        date: "8/5/2026",
        regionKeywords: ["north dakota", "nd"],
        baseConfidence: 0.80,
        data: { high: 92, low: 64, wind: 44, gusts: 80, condition: "Windy / Hot & Gusty" }
    },
    {
        date: "8/6/2026",
        regionKeywords: ["minnesota", "mn"],
        baseConfidence: 0.92,
        data: { high: 70, low: 34, wind: 39, gusts: 87, condition: "Windy / High Gusts (Northern MN)" }
    },
    {
        date: "8/7/2026",
        regionKeywords: ["wisconsin", "wi"],
        baseConfidence: 0.75,
        data: { high: 62, low: 40, wind: 55, gusts: 99, condition: "Windy / Cool & Severe Winds" }
    }
];

function getHashOffset(str) {
    let hash = 0;
    for (let i = 0; i < str.length; i++) {
        hash = str.charCodeAt(i) + ((hash << 5) - hash);
    }
    return hash;
}

function calculateEffectiveConfidence(dateStr, baseConfidence) {
    const now = new Date();
    const eventDate = new Date(dateStr); 
    const diffMs = eventDate.getTime() - now.getTime();
    const daysDiff = diffMs / (1000 * 60 * 60 * 24);

    let proximityMultiplier = 1.0;
    if (daysDiff > 0) {
        proximityMultiplier = Math.max(0.3, 1.0 - (daysDiff * 0.12));
    } else {
        const currentFractionalHour = now.getHours() + 
                                      (now.getMinutes() / 60) + 
                                      (now.getSeconds() / 3600) + 
                                      (now.getMilliseconds() / 3600000);
        proximityMultiplier = Math.max(0.2, 1.0 - (currentFractionalHour / 24) * 0.5);
    }

    return Math.max(0, Math.min(1.0, baseConfidence * proximityMultiplier));
}

function findRegionalOverride(dateStr, searchString, placeName, apiHigh, apiLow, apiWind, apiGusts) {
    const searchLower = `${searchString} ${placeName}`.toLowerCase();
    
    const event = regionalEvents.find(e => e.date === dateStr);
    if (!event) return null;

    const matchesRegion = event.regionKeywords.some(keyword => {
        const regex = new RegExp(`\\b${keyword}\\b`, 'i');
        return regex.test(searchLower);
    });

    if (!matchesRegion) return null;

    const base = event.data;
    const isStateOnly = event.regionKeywords.some(k => searchString.trim().toLowerCase() === k);

    let tempOffset = 0;
    let windOffset = 0;
    let gustOffset = 0;

    if (!isStateOnly) {
        const hash = Math.abs(getHashOffset(placeName));
        tempOffset = (hash % 9) - 4;       
        windOffset = (hash % 7) - 3;       
        gustOffset = (hash % 11) - 5;      
    }

    const targetHigh = base.high + tempOffset;
    const targetLow = base.low + Math.round(tempOffset / 2);
    const targetWind = Math.max(5, base.wind + windOffset);
    const targetGusts = Math.max(10, base.gusts + gustOffset);

    const effectiveConfidence = calculateEffectiveConfidence(dateStr, event.baseConfidence);

    const finalHigh = Math.round(targetHigh * effectiveConfidence + apiHigh * (1 - effectiveConfidence));
    const finalLow = Math.round(targetLow * effectiveConfidence + apiLow * (1 - effectiveConfidence));
    const finalWind = Math.round(targetWind * effectiveConfidence + apiWind * (1 - effectiveConfidence));
    const finalGusts = Math.round(targetGusts * effectiveConfidence + apiGusts * (1 - effectiveConfidence));

    const confPercent = Math.round(effectiveConfidence * 100);
    const label = `${base.condition} (${confPercent}% Confidence)`;

    return {
        high: finalHigh,
        low: finalLow,
        wind: finalWind,
        gusts: finalGusts,
        condition: label,
        rawCondition: base.condition,
        baseEvent: base,
        effectiveConfidence: effectiveConfidence
    };
}

async function fetchForecast() {
    const query = document.getElementById("searchInput").value.trim();
    const container = document.getElementById("forecastContainer");

    if (!query) {
        container.innerHTML = "";
        return;
    }

    container.innerHTML = "<p>Searching location...</p>";

    try {
        const geoRes = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(query)}&count=1&language=en&format=json`);
        const geoData = await geoRes.json();

        if (!geoData.results || geoData.results.length === 0) {
            container.innerHTML = "<p>Location not found. Please try another search.</p>";
            return;
        }

        const place = geoData.results[0];
        currentLat = place.latitude;
        currentLon = place.longitude;
        
        const locationParts = [place.name, place.admin1, place.country_code ? place.country_code.toUpperCase() : ''].filter(Boolean);
        const placeName = locationParts.join(', ');

        document.getElementById("locationTitle").innerText = `${placeName} Forecast`;
        document.getElementById("locationSub").innerText = `Lat: ${currentLat.toFixed(2)}°, Lon: ${currentLon.toFixed(2)}°`;

        const weatherUrl = `https://api.open-meteo.com/v1/forecast?latitude=${currentLat}&longitude=${currentLon}&daily=weather_code,temperature_2m_max,temperature_2m_min,wind_speed_10m_max,wind_gusts_10m_max&hourly=temperature_2m,wind_speed_10m,wind_gusts_10m&temperature_unit=fahrenheit&wind_speed_unit=mph&timezone=auto`;
        
        const weatherRes = await fetch(weatherUrl);
        const weatherData = await weatherRes.json();

        activeHourlyData = weatherData.hourly;

        parseAndRender(weatherData, query, placeName);

    } catch (err) {
        console.error(err);
        container.innerHTML = "<p>Error loading weather data. Please try again.</p>";
    }
}

function parseAndRender(data, searchQuery, placeName) {
    const daysOfWeek = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
    const daily = data.daily;
    const forecastData = [];

    const targetDates = [
        "7/31/2026", "8/1/2026", "8/2/2026", "8/3/2026", "8/4/2026", "8/5/2026", "8/6/2026", "8/7/2026"
    ];

    let maxGustInForecast = 110;

    targetDates.forEach((dateStr, i) => {
        const [m, d, y] = dateStr.split("/").map(Number);
        const dateObj = new Date(y, m - 1, d);
        const dayLabel = i === 0 ? "Today" : daysOfWeek[dateObj.getDay()];

        const apiCode = daily.weather_code ? daily.weather_code[i] : 0;
        const apiHigh = Math.round(daily.temperature_2m_max[i] || 72);
        const apiLow = Math.round(daily.temperature_2m_min[i] || 52);
        const apiWind = Math.round(daily.wind_speed_10m_max[i] || 18);
        const apiGusts = Math.round(daily.wind_gusts_10m_max[i] || 30);

        const matchedOverride = findRegionalOverride(dateStr, searchQuery, placeName, apiHigh, apiLow, apiWind, apiGusts);

        if (matchedOverride && activeHourlyData) {
            const [mm, dd, yy] = dateStr.split("/").map(Number);
            const formattedDate = `${yy}-${String(mm).padStart(2, '0')}-${String(dd).padStart(2, '0')}`;
            
            for (let h = 0; h < activeHourlyData.time.length; h++) {
                if (activeHourlyData.time[h].startsWith(formattedDate)) {
                    const hourStr = activeHourlyData.time[h].split("T")[1];
                    const hourNum = parseInt(hourStr.split(":")[0], 10);

                    let blendWeight = 0;
                    if (hourNum < 1) {
                        blendWeight = 0;
                    } else if (hourNum >= 1 && hourNum <= 12) {
                        blendWeight = (hourNum - 1) / (12 - 1);
                    } else if (hourNum > 12 && hourNum <= 16) {
                        blendWeight = 1.0;
                    } else if (hourNum > 16 && hourNum <= 23) {
                        blendWeight = 1.0 - ((hourNum - 16) / (23 - 16));
                    }

                    let origTemp = activeHourlyData.temperature_2m[h];
                    let origWind = activeHourlyData.wind_speed_10m[h];
                    let origGust = activeHourlyData.wind_gusts_10m[h];

                    let targetTempSeq = matchedOverride.baseEvent.high;
                    let targetWindSeq = matchedOverride.baseEvent.wind;
                    let targetGustSeq = matchedOverride.baseEvent.gusts;

                    let finalWeight = blendWeight * matchedOverride.effectiveConfidence;

                    activeHourlyData.temperature_2m[h] = Math.round(targetTempSeq * finalWeight + origTemp * (1 - finalWeight));
                    activeHourlyData.wind_speed_10m[h] = Math.round(targetWindSeq * finalWeight + origWind * (1 - finalWeight));
                    activeHourlyData.wind_gusts_10m[h] = Math.round(targetGustSeq * finalWeight + origGust * (1 - finalWeight));
                }
            }
        }

        let calcHigh = apiHigh;
        let calcLow = apiLow;
        let calcWind = apiWind;
        let calcGusts = apiGusts;

        if (activeHourlyData) {
            const [mm, dd, yy] = dateStr.split("/").map(Number);
            const formattedDate = `${yy}-${String(mm).padStart(2, '0')}-${String(dd).padStart(2, '0')}`;
            let dayTemps = [];
            let dayWinds = [];
            let dayGusts = [];

            for (let h = 0; h < activeHourlyData.time.length; h++) {
                if (activeHourlyData.time[h].startsWith(formattedDate)) {
                    dayTemps.push(activeHourlyData.temperature_2m[h]);
                    dayWinds.push(activeHourlyData.wind_speed_10m[h]);
                    dayGusts.push(activeHourlyData.wind_gusts_10m[h]);
                }
            }

            if (dayTemps.length > 0) {
                calcHigh = Math.max(...dayTemps);
                calcLow = Math.min(...dayTemps);
                calcWind = Math.max(...dayWinds);
                calcGusts = Math.max(...dayGusts);
            }
        }

        const high = matchedOverride ? calcHigh : apiHigh;
        const low = matchedOverride ? calcLow : apiLow;
        const wind = matchedOverride ? calcWind : apiWind;
        const gusts = matchedOverride ? calcGusts : apiGusts;
        const note = matchedOverride ? matchedOverride.condition : "";

        const iconUrl = getWeatherIcon(apiCode, matchedOverride ? matchedOverride.rawCondition : "");

        if (gusts > maxGustInForecast) {
            maxGustInForecast = gusts;
        }

        forecastData.push({
            day: dayLabel,
            dateStr: dateStr,
            high: high,
            low: low,
            wind: wind,
            gusts: gusts,
            note: note,
            iconUrl: iconUrl,
            maxGustScale: maxGustInForecast
        });
    });

    renderForecast(forecastData);
}

function renderForecast(forecastData) {
    const container = document.getElementById("forecastContainer");
    container.innerHTML = "";

    forecastData.forEach(item => {
        const card = document.createElement("div");
        card.className = "day-card";
        card.onclick = () => openGraphModal(item);

        const dayName = document.createElement("div");
        dayName.className = "day-name";
        dayName.innerText = item.day;

        const dayDate = document.createElement("div");
        dayDate.className = "day-date";
        dayDate.innerText = item.dateStr;

        // Weather Icon Section
        const iconContainer = document.createElement("div");
        iconContainer.className = "weather-icon-container";
        const iconImg = document.createElement("img");
        iconImg.className = "weather-icon";
        iconImg.src = item.iconUrl;
        iconImg.alt = "Weather Icon";
        iconContainer.appendChild(iconImg);

        // Temperature Section
        const tempTitle = document.createElement("div");
        tempTitle.className = "section-title";
        tempTitle.innerText = "Temperature";

        const highColor = getTempColor(item.high);
        const lowColor = getTempColor(item.low);

        const tempDisplay = document.createElement("div");
        tempDisplay.className = "metric-val";
        tempDisplay.style.color = highColor;
        tempDisplay.innerText = `${item.high}°F`;

        const tempRange = document.createElement("div");
        tempRange.className = "metric-sub";
        tempRange.innerHTML = `Low: <span style="color: ${lowColor}; font-weight: bold;">${item.low}°F</span>`;

        const tempBar = document.createElement("div");
        tempBar.className = "bar";
        const tempFill = document.createElement("div");
        tempFill.className = "bar-fill";
        const tempPct = Math.min(Math.max(((item.high - (-20)) / (110 - (-20))) * 100, 5), 100);
        tempFill.style.width = tempPct + "%";
        tempFill.style.backgroundColor = highColor;
        tempBar.appendChild(tempFill);

        // Sustained Wind Section
        const windTitle = document.createElement("div");
        windTitle.className = "section-title";
        windTitle.innerText = "Sustained Wind";

        const windColor = getWindColor(item.wind);

        const windDisplay = document.createElement("div");
        windDisplay.className = "metric-val";
        windDisplay.style.color = windColor;
        windDisplay.innerText = `${item.wind} mph`;

        const windSub = document.createElement("div");
        windSub.className = "metric-sub";
        windSub.style.color = "#aaa";
        windSub.innerText = `Sustained`;

        const windBar = document.createElement("div");
        windBar.className = "bar";
        const windFill = document.createElement("div");
        windFill.className = "bar-fill";
        const windPct = Math.min(Math.max((item.wind / item.maxGustScale) * 100, 4), 100);
        windFill.style.width = windPct + "%";
        windFill.style.backgroundColor = windColor;
        windBar.appendChild(windFill);

        // Peak Gusts Section
        const gustTitle = document.createElement("div");
        gustTitle.className = "section-title";
        gustTitle.innerText = "Peak Gusts";

        const gustColor = getWindColor(item.gusts);

        const gustDisplay = document.createElement("div");
        gustDisplay.className = "metric-val";
        gustDisplay.style.color = gustColor;
        gustDisplay.innerText = `${item.gusts} mph`;

        const gustSub = document.createElement("div");
        gustSub.className = "metric-sub";
        gustSub.style.color = "#aaa";
        gustSub.innerText = item.note ? item.note : `Peak Gust`;

        const gustBar = document.createElement("div");
        gustBar.className = "bar";
        const gustFill = document.createElement("div");
        gustFill.className = "bar-fill";
        const gustPct = Math.min(Math.max((item.gusts / item.maxGustScale) * 100, 4), 100);
        gustFill.style.width = gustPct + "%";
        gustFill.style.backgroundColor = gustColor;
        gustBar.appendChild(gustFill);

        const clickHint = document.createElement("div");
        clickHint.className = "click-hint";
        clickHint.innerText = "Click to view hourly graph";

        card.appendChild(dayName);
        card.appendChild(dayDate);
        card.appendChild(iconContainer);
        card.appendChild(tempTitle);
        card.appendChild(tempDisplay);
        card.appendChild(tempRange);
        card.appendChild(tempBar);
        card.appendChild(windTitle);
        card.appendChild(windDisplay);
        card.appendChild(windSub);
        card.appendChild(windBar);
        card.appendChild(gustTitle);
        card.appendChild(gustDisplay);
        card.appendChild(gustSub);
        card.appendChild(gustBar);
        card.appendChild(clickHint);

        container.appendChild(card);
    });
}

// Modal & Graph Functions
function openGraphModal(item) {
    activeDayDateStr = item.dateStr;
    document.getElementById("modalTitle").innerText = `${item.day} Hourly Forecast`;
    document.getElementById("modalSubtitle").innerText = `Date: ${item.dateStr}`;
    document.getElementById("chartModal").style.display = "flex";
    
    updateChartMetric();
    startLiveTimer();
}

function closeModal() {
    document.getElementById("chartModal").style.display = "none";
    if (liveTimerInterval) {
        clearInterval(liveTimerInterval);
        liveTimerInterval = null;
    }
}

function startLiveTimer() {
    if (liveTimerInterval) clearInterval(liveTimerInterval);

    updateLiveConfidenceDisplay();
    liveTimerInterval = setInterval(() => {
        updateLiveConfidenceDisplay();
        updateChartMetric(true);
    }, 1000);
}

function updateLiveConfidenceDisplay() {
    if (!activeDayDateStr) return;
    
    const now = new Date();
    const [m, d, y] = activeDayDateStr.split("/").map(Number);
    const eventDate = new Date(y, m - 1, d);
    
    const diffMs = eventDate.getTime() - now.getTime();
    
    const hours = String(now.getHours()).padStart(2, '0');
    const minutes = String(now.getMinutes()).padStart(2, '0');
    const seconds = String(now.getSeconds()).padStart(2, '0');
    
    let baseConf = 0.85;
    const event = regionalEvents.find(e => e.date === activeDayDateStr);
    if (event) {
        baseConf = event.baseConfidence;
    }
    
    const currentEffectiveConf = calculateEffectiveConfidence(activeDayDateStr, baseConf);
    const confPercent = (currentEffectiveConf * 100).toFixed(1);

    let timeUntilText = "";
    if (diffMs > 0) {
        const totalSecs = Math.floor(diffMs / 1000);
        const dRem = Math.floor(totalSecs / (3600 * 24));
        const hRem = Math.floor((totalSecs % (3600 * 24)) / 3600);
        const mRem = Math.floor((totalSecs % 3600) / 60);
        const sRem = totalSecs % 60;
        timeUntilText = `${dRem}d ${hRem}h ${mRem}m ${sRem}s away`;
    } else {
        timeUntilText = "Event Day / Active Now";
    }

    document.getElementById("modalConfVal").innerText = 
        `Live Clock: ${hours}:${minutes}:${seconds} | ${timeUntilText} | Confidence: ${confPercent}%`;
}

function hexToRgba(hex, alpha) {
    let bigint = parseInt(hex.replace('#',''), 16);
    let r = (bigint >> 16) & 255;
    let g = (bigint >> 8) & 255;
    let b = bigint & 255;
    return `rgba(${r}, ${g}, ${b}, ${alpha})`;
}

function updateChartMetric(isLiveUpdate = false) {
    if (!activeHourlyData || !activeDayDateStr) return;

    const metric = document.getElementById("metricSelector").value;
    const [m, d, y] = activeDayDateStr.split("/").map(Number);
    const formattedDate = `${y}-${String(m).padStart(2, '0')}-${String(d).padStart(2, '0')}`;

    const labels = [];
    const values = [];
    const segmentColors = [];

    let baseConf = 0.85;
    const event = regionalEvents.find(e => e.date === activeDayDateStr);
    if (event) {
        baseConf = event.baseConfidence;
    }
    const liveConfidence = calculateEffectiveConfidence(activeDayDateStr, baseConf);

    for (let i = 0; i < activeHourlyData.time.length; i++) {
        if (activeHourlyData.time[i].startsWith(formattedDate)) {
            const timePart = activeHourlyData.time[i].split("T")[1];
            labels.push(timePart);

            let val = 0;
            let color = "#007aff";

            if (metric === "temp") {
                let baseTemp = activeHourlyData.temperature_2m[i];
                let wave = Math.sin(Date.now() / 1000 + i) * (1 - liveConfidence) * 3;
                val = Math.round(baseTemp + wave);
                color = getTempColor(val);
            } else if (metric === "wind") {
                let baseWind = activeHourlyData.wind_speed_10m[i];
                let wave = Math.cos(Date.now() / 1000 + i) * (1 - liveConfidence) * 4;
                val = Math.max(0, Math.round(baseWind + wave));
                color = getWindColor(val);
            } else if (metric === "gusts") {
                let baseGust = activeHourlyData.wind_gusts_10m[i];
                let wave = Math.sin(Date.now() / 800 + i) * (1 - liveConfidence) * 6;
                val = Math.max(0, Math.round(baseGust + wave));
                color = getWindColor(val);
            }

            values.push(val);
            segmentColors.push(color);
        }
    }

    const labelName = metric === 'temp' ? "Temperature (°F)" : (metric === 'wind' ? "Wind Speed (mph)" : "Wind Gusts (mph)");

    renderChart(labels, values, segmentColors, labelName, metric, isLiveUpdate);
}

function renderChart(labels, values, segmentColors, labelName, metric, isLiveUpdate) {
    const ctx = document.getElementById("forecastChart").getContext("2d");

    if (chartInstance && isLiveUpdate) {
        chartInstance.data.labels = labels;
        chartInstance.data.datasets[0].data = values;
        chartInstance.data.datasets[0].pointHoverBackgroundColor = segmentColors;
        chartInstance.update('none');
        return;
    }

    if (chartInstance) {
        chartInstance.destroy();
    }

    const gradient = ctx.createLinearGradient(0, 0, 0, 330);
    const minVal = Math.min(...values);
    const maxVal = Math.max(...values);
    
    const numStops = 6;
    for (let s = 0; s <= numStops; s++) {
        let ratio = s / numStops;
        let interpolatedVal = maxVal - (ratio * (maxVal - minVal));
        let stopColor = metric === 'temp' ? getTempColor(interpolatedVal) : getWindColor(interpolatedVal);
        let alpha = 0.45 * (1 - ratio * 0.7);
        gradient.addColorStop(ratio, hexToRgba(stopColor, alpha));
    }

    chartInstance = new Chart(ctx, {
        type: 'line',
        data: {
            labels: labels,
            datasets: [{
                label: labelName,
                data: values,
                backgroundColor: gradient,
                borderWidth: 3,
                fill: true,
                tension: 0.35,
                pointRadius: 0,
                pointHoverRadius: 6,
                pointHoverBackgroundColor: function(context) {
                    let index = context.dataIndex;
                    return segmentColors[index] || '#fff';
                },
                pointHoverBorderColor: '#fff',
                pointHoverBorderWidth: 2,
                segment: {
                    borderColor: function(ctx) {
                        let val = ctx.p1.parsed.y;
                        return metric === 'temp' ? getTempColor(val) : getWindColor(val);
                    }
                }
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            animation: {
                duration: 400
            },
            interaction: {
                mode: 'index',
                intersect: false
            },
            scales: {
                x: {
                    grid: { color: '#2a2a2a' },
                    ticks: { color: '#aaa' }
                },
                y: {
                    grid: { color: '#2a2a2a' },
                    ticks: { color: '#aaa' }
                }
            },
            plugins: {
                legend: { labels: { color: '#fff' } },
                tooltip: {
                    enabled: true,
                    callbacks: {
                        label: function(context) {
                            let label = context.dataset.label || '';
                            if (label) label += ': ';
                            if (context.parsed.y !== null) {
                                label += context.parsed.y + (context.dataset.label.includes('Temperature') ? '°F' : ' mph');
                            }
                            return label;
                        }
                    }
                }
            }
        }
    });
}

document.getElementById("searchInput").addEventListener("keyup", function(event) {
    if (event.key === "Enter") {
        fetchForecast();
    }
});
