<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>USA 7-Day Weather Forecast</title>
<style>
    body { font-family: 'Segoe UI', Arial, sans-serif; background:#0d0d0d; color:#fff; padding:20px; }
    h1 { text-align:center; margin-bottom:5px; font-size:32px; }
    .subtitle { text-align:center; color:#888; font-size:14px; margin-bottom:20px; }

    /* Search Bar & Environment Controls Styling */
    .controls-container { display: flex; flex-direction: column; align-items: center; gap: 12px; margin-bottom: 25px; }
    .search-container { display: flex; justify-content: center; gap: 10px; }
    .search-input { 
        padding: 10px 16px; 
        font-size: 16px; 
        border-radius: 8px; 
        border: 1px solid #333; 
        background: #1c1c1c; 
        color: #fff; 
        width: 280px; 
        outline: none;
    }
    .search-input:focus { border-color: #00a8cc; }
    .btn { 
        padding: 10px 18px; 
        font-size: 14px; 
        border: none; 
        border-radius: 8px; 
        background: #2a2a2a; 
        color: #fff; 
        font-weight: bold; 
        cursor: pointer; 
        transition: all .2s;
    }
    .search-btn { background: #00a8cc; }
    .search-btn:hover { background: #0082a3; }

    .env-toggle { display: flex; gap: 8px; align-items: center; background: #1c1c1c; padding: 6px 12px; border-radius: 10px; border: 1px solid #333; }
    .env-label { font-size: 12px; text-transform: uppercase; letter-spacing: 1px; color: #888; margin-right: 4px; }
    .env-btn.active { background: #00a8cc; color: #fff; }

    .forecast-container { display:flex; flex-wrap:wrap; gap:18px; justify-content:center; }
    .day-card { background:#1c1c1c; padding:18px; border-radius:14px; width:220px;
                box-shadow:0 0 18px rgba(0,0,0,0.6); transition:transform .2s; }
    .day-card:hover { transform:scale(1.05); }
    .day-name { font-size:20px; text-align:center; margin-bottom:2px; font-weight:bold; }
    .day-date { font-size:12px; color:#777; text-align:center; margin-bottom:14px; }
    
    .section-title { font-size:11px; text-transform:uppercase; letter-spacing:1px; color:#777; margin-bottom:4px; }

    /* Values & Labels */
    .metric-val { font-size:24px; font-weight:bold; margin-bottom:2px; }
    .metric-sub { font-size:13px; font-weight: 500; margin-bottom:6px; }

    /* Bar Styling */
    .bar { height:10px; background:#2a2a2a; border-radius:5px; overflow:hidden; margin-bottom:12px; }
    .bar-fill { height:100%; border-radius:5px; transition:width .8s, background-color .8s; }
</style>
</head>
<body>

<h1 id="locationTitle">Babbitt, MN 7-Day Forecast</h1>
<div class="subtitle" id="locationSub">Daily temperature and wind trends with terrain surface adjustments</div>

<div class="controls-container">
    <div class="search-container">
        <input type="text" id="searchInput" class="search-input" placeholder="e.g., Babbitt, MN" value="Babbitt, MN">
        <button onclick="fetchForecast()" class="btn search-btn">Search</button>
    </div>

    <div class="env-toggle">
        <span class="env-label">Terrain Impact:</span>
        <button class="btn env-btn" id="treeBtn" onclick="setTerrain('forest')">🌲 Forest / Trees (-20%)</button>
        <button class="btn env-btn active" id="normalBtn" onclick="setTerrain('normal')">Standard</button>
        <button class="btn env-btn" id="fieldBtn" onclick="setTerrain('field')">🌾 Open Field (+15%)</button>
    </div>
</div>

<div class="forecast-container" id="forecastContainer">Loading forecast data...</div>

<script>
let currentTerrain = 'normal'; // Options: 'forest', 'normal', 'field'
let rawForecastData = [];

// Color scale mappings
function getTempColor(temp) {
    if (temp >= 110) return "#7b003a";
    if (temp >= 95)  return "#bd0042";
    if (temp >= 85)  return "#ff3300";
    if (temp >= 75)  return "#ffaa00";
    if (temp >= 65)  return "#ffff00";
    if (temp >= 55)  return "#88ff00";
    if (temp >= 45)  return "#00ffcc";
    if (temp >= 35)  return "#0099ff";
    if (temp >= 20)  return "#0033cc";
    if (temp >= 0)   return "#4b0082";
    return "#330044";
}

function getWindColor(speed) {
    if (speed >= 90) return "#5e0024";
    if (speed >= 80) return "#990000";
    if (speed >= 70) return "#cc0000";
    if (speed >= 60) return "#e62e00";
    if (speed >= 50) return "#f54e00";
    if (speed >= 45) return "#f57c00";
    if (speed >= 40) return "#f5ab00";
    if (speed >= 35) return "#f0e100";
    if (speed >= 30) return "#a3e000";
    if (speed >= 25) return "#45db00";
    if (speed >= 20) return "#00c875";
    if (speed >= 15) return "#00a8cc";
    if (speed >= 10) return "#2b5cbf";
    if (speed >= 5)  return "#5a2a9e";
    return "#2d0a4e";
}

function setTerrain(type) {
    currentTerrain = type;
    document.getElementById("treeBtn").classList.toggle("active", type === 'forest');
    document.getElementById("normalBtn").classList.toggle("active", type === 'normal');
    document.getElementById("fieldBtn").classList.toggle("active", type === 'field');
    renderForecast();
}

async function fetchForecast() {
    const query = document.getElementById("searchInput").value.trim();
    const container = document.getElementById("forecastContainer");

    if (!query) return;

    container.innerHTML = "Searching location...";

    try {
        const geoRes = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(query)}&count=1&language=en&format=json`);
        const geoData = await geoRes.json();

        if (!geoData.results || geoData.results.length === 0) {
            container.innerHTML = "Location not found. Please try another search.";
            return;
        }

        const place = geoData.results[0];
        const lat = place.latitude;
        const lon = place.longitude;
        const placeName = `${place.name}${place.admin1 ? ', ' + place.admin1 : ''}`;

        document.getElementById("locationTitle").innerText = `${placeName} 7-Day Forecast`;

        container.innerHTML = "Loading weather data...";
        const weatherUrl = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&daily=temperature_2m_max,temperature_2m_min,wind_speed_10m_max,wind_gusts_10m_max&temperature_unit=fahrenheit&wind_speed_unit=mph&timezone=auto`;
        
        const weatherRes = await fetch(weatherUrl);
        const weatherData = await weatherRes.json();

        parseAndStore(weatherData);

    } catch (err) {
        console.error(err);
        container.innerHTML = "Error loading weather data. Fetching hardcoded fallback.";
        loadFallbackData();
    }
}

function parseAndStore(data) {
    const daysOfWeek = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
    const daily = data.daily;
    rawForecastData = [];

    for (let i = 0; i < daily.time.length; i++) {
        const dateObj = new Date(daily.time[i] + "T00:00:00");
        const dayLabel = i === 0 ? "Today" : daysOfWeek[dateObj.getDay()];
        const dateString = `${dateObj.getMonth() + 1}/${dateObj.getDate()}/${dateObj.getFullYear()}`;

        // Inject specified values for 8/6/2026 if matching date
        let high = Math.round(daily.temperature_2m_max[i]);
        let low = Math.round(daily.temperature_2m_min[i]);
        let wind = Math.round(daily.wind_speed_10m_max[i]);
        let gusts = Math.round(daily.wind_gusts_10m_max[i]);

        if (dateString === "8/6/2026") {
            high = 70;
            low = 34;
            wind = 33;
            gusts = 70;
        }

        rawForecastData.push({ day: dayLabel, dateStr: dateString, high, low, wind, gusts });
    }

    renderForecast();
}

function loadFallbackData() {
    rawForecastData = [
        { day: "Thu", dateStr: "8/6/2026", high: 70, low: 34, wind: 33, gusts: 70 },
        { day: "Fri", dateStr: "8/7/2026", high: 72, low: 40, wind: 15, gusts: 25 },
        { day: "Sat", dateStr: "8/8/2026", high: 75, low: 45, wind: 10, gusts: 18 },
        { day: "Sun", dateStr: "8/9/2026", high: 78, low: 48, wind: 8,  gusts: 14 },
        { day: "Mon", dateStr: "8/10/2026", high: 74, low: 42, wind: 12, gusts: 20 },
        { day: "Tue", dateStr: "8/11/2026", high: 69, low: 38, wind: 18, gusts: 30 },
        { day: "Wed", dateStr: "8/12/2026", high: 66, low: 35, wind: 22, gusts: 40 }
    ];
    renderForecast();
}

function renderForecast() {
    const container = document.getElementById("forecastContainer");
    container.innerHTML = "";

    // Friction factor for surface terrain
    let windMult = 1.0;
    if (currentTerrain === 'forest') windMult = 0.80; // Trees slow down wind (~20% reduction)
    if (currentTerrain === 'field')  windMult = 1.15; // Open fields increase wind (~15% boost)

    rawForecastData.forEach(item => {
        const card = document.createElement("div");
        card.className = "day-card";

        const dayName = document.createElement("div");
        dayName.className = "day-name";
        dayName.innerText = item.day;

        const dayDate = document.createElement("div");
        dayDate.className = "day-date";
        dayDate.innerText = item.dateStr;

        // Apply surface friction modifier
        const adjWind = Math.round(item.wind * windMult);
        const adjGusts = Math.round(item.gusts * windMult);

        // --- 1. Temperature Section ---
        const tempTitle = document.createElement("div");
        tempTitle.className = "section-title";
        tempTitle.innerText = "Temperature";

        const highColor = getTempColor(item.high);
        const lowColor = getTempColor(item.low);

        const tempDisplay = document.createElement("div");
        tempDisplay.className = "metric-val";
        tempDisplay.style.color = highColor;
        tempDisplay.innerText = `${item.high}°F`;

        const tempRange = document.createElement("div");
        tempRange.className = "metric-sub";
        tempRange.innerHTML = `Low: <span style="color: ${lowColor}; font-weight: bold;">${item.low}°F</span>`;

        const tempBar = document.createElement("div");
        tempBar.className = "bar";
        const tempFill = document.createElement("div");
        tempFill.className = "bar-fill";
        tempFill.style.width = Math.min(Math.max(((item.high - (-40)) / (120 - (-40))) * 100, 5), 100) + "%";
        tempFill.style.backgroundColor = highColor;
        tempBar.appendChild(tempFill);

        // --- 2. Sustained Wind Section ---
        const windTitle = document.createElement("div");
        windTitle.className = "section-title";
        windTitle.innerText = "Wind Speed";

        const windColor = getWindColor(adjWind);

        const windDisplay = document.createElement("div");
        windDisplay.className = "metric-val";
        windDisplay.style.color = windColor;
        windDisplay.innerText = `${adjWind} mph`;

        const windSub = document.createElement("div");
        windSub.className = "metric-sub";
        windSub.style.color = "#aaa";
        windSub.innerText = `Sustained`;

        const windBar = document.createElement("div");
        windBar.className = "bar";
        const windFill = document.createElement("div");
        windFill.className = "bar-fill";
        windFill.style.width = Math.min(Math.max((adjWind / 90) * 100, 5), 100) + "%";
        windFill.style.backgroundColor = windColor;
        windBar.appendChild(windFill);

        // --- 3. Wind Gusts Section ---
        const gustTitle = document.createElement("div");
        gustTitle.className = "section-title";
        gustTitle.innerText = "Peak Gusts";

        const gustColor = getWindColor(adjGusts);

        const gustDisplay = document.createElement("div");
        gustDisplay.className = "metric-val";
        gustDisplay.style.color = gustColor;
        gustDisplay.innerText = `${adjGusts} mph`;

        const gustSub = document.createElement("div");
        gustSub.className = "metric-sub";
        gustSub.style.color = "#aaa";
        gustSub.innerText = `Max Gusts`;

        const gustBar = document.createElement("div");
        gustBar.className = "bar";
        const gustFill = document.createElement("div");
        gustFill.className = "bar-fill";
        gustFill.style.width = Math.min(Math.max((adjGusts / 90) * 100, 5), 100) + "%";
        gustFill.style.backgroundColor = gustColor;
        gustBar.appendChild(gustFill);

        // Assemble card
        card.appendChild(dayName);
        card.appendChild(dayDate);

        card.appendChild(tempTitle);
        card.appendChild(tempDisplay);
        card.appendChild(tempRange);
        card.appendChild(tempBar);

        card.appendChild(windTitle);
        card.appendChild(windDisplay);
        card.appendChild(windSub);
        card.appendChild(windBar);

        card.appendChild(gustTitle);
        card.appendChild(gustDisplay);
        card.appendChild(gustSub);
        card.appendChild(gustBar);

        container.appendChild(card);
    });
}

document.getElementById("searchInput").addEventListener("keyup", function(event) {
    if (event.key === "Enter") {
        fetchForecast();
    }
});

fetchForecast();
</script>

</body>
</html>
