<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Summer Celebration Intensity</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(to bottom, #ffefba, #ffffff);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }

    h1 {
      margin-bottom: 10px;
    }

    #info {
      margin-bottom: 20px;
      font-size: 1rem;
    }

    .bar-container {
      width: 80%;
      max-width: 500px;
      height: 30px;
      border-radius: 15px;
      background: #eee;
      overflow: hidden;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    .bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #ff9800, #ff5722);
      transition: width 0.5s ease;
    }

    #percent {
      margin-top: 10px;
      font-size: 1.2rem;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <h1>Summer Celebration Surprise</h1>
  <div id="info">Intensity updates live without reloading.</div>

  <div class="bar-container">
    <div class="bar-fill" id="barFill"></div>
  </div>
  <div id="percent">0%</div>

  <script>
    const startIntensity = 0;      // before 7 AM today
    const peakIntensity = 100;     // at 3 PM today

    function getTimeStamp(h, m, year, month, day) {
      return new Date(year, month, day, h, m).getTime();
    }

    const now = new Date();

    // Ramp-up: 7 AM → 3 PM today
    const rampStart = getTimeStamp(7, 0, now.getFullYear(), now.getMonth(), now.getDate());
    const rampPeak  = getTimeStamp(15, 0, now.getFullYear(), now.getMonth(), now.getDate());

    // Ramp-down begins at 7 AM on July 31, 2026
    const rampDownStart = getTimeStamp(7, 0, 2026, 6, 31); // July = 6

    // Ramp-down ends 12 hours later (adjust if needed)
    const rampDownEnd = rampDownStart + (1000 * 60 * 60 * 12);

    function getCelebrationIntensity() {
      const now = Date.now();

      // Before 7 AM today → 0%
      if (now < rampStart) {
        return startIntensity;
      }

      // Ramp UP: 7 AM → 3 PM today
      if (now >= rampStart && now < rampPeak) {
        const total = rampPeak - rampStart;
        const elapsed = now - rampStart;
        const progress = elapsed / total;
        return startIntensity + (peakIntensity - startIntensity) * progress;
      }

      // Hold 100% until 7 AM 7/31/26
      if (now >= rampPeak && now < rampDownStart) {
        return peakIntensity;
      }

      // Ramp DOWN: 7 AM 7/31/26 → rampDownEnd
      if (now >= rampDownStart && now < rampDownEnd) {
        const total = rampDownEnd - rampDownStart;
        const elapsed = now - rampDownStart;
        const progress = elapsed / total;
        return peakIntensity * (1 - progress);
      }

      // After rampDownEnd → 0%
      return 0;
    }

    function updateBar() {
      const intensity = getCelebrationIntensity();
      const bar = document.getElementById('barFill');
      const percentText = document.getElementById('percent');

      bar.style.width = intensity + '%';
      percentText.textContent = Math.round(intensity) + '%';
    }

    updateBar();
    setInterval(updateBar, 1000);
  </script>
</body>
</html>
