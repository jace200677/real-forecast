<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>USA 7-Day DOS Forecast</title>
<style>
    body { font-family: Arial, sans-serif; background:#0d0d0d; color:#fff; padding:20px; }
    h1 { text-align:center; margin-bottom:25px; font-size:32px; }
    .forecast-container { display:flex; flex-wrap:wrap; gap:18px; justify-content:center; }
    .day-card { background:#1c1c1c; padding:18px; border-radius:14px; width:190px;
                box-shadow:0 0 18px rgba(0,0,0,0.6); transition:transform .2s; }
    .day-card:hover { transform:scale(1.06); }
    .day-name { font-size:20px; text-align:center; margin-bottom:10px; }
    .dos-value { font-size:40px; font-weight:bold; text-align:center; margin-bottom:6px; }
    .dos-label { font-size:13px; text-align:center; opacity:.85; margin-bottom:12px; min-height:36px; }
    .high-impact { color:#ff3b3b; font-weight:bold; }
    .bar { height:14px; background:#333; border-radius:8px; overflow:hidden; }
    .bar-fill { height:100%; background:linear-gradient(90deg,#00ff00,#ffff00,#ff8800,#ff0000,#b300ff);
                transition:width .8s; }
</style>
</head>
<body>

<h1>USA 7-Day Daily Outlook Score</h1>
<div class="forecast-container" id="forecastContainer">Loading live NOAA hazard data...</div>

<script>

// ------------------------------
// FETCH REAL NWS ACTIVE ALERTS
// ------------------------------
async function fetchActiveAlerts() {
    try {
        const response = await fetch("https://api.weather.gov/alerts/active");
        if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
        const data = await response.json();
        return data.features || [];
    } catch (err) {
        console.error("Failed to fetch NWS alerts:", err);
        return null;
    }
}

// ------------------------------
// SCORE ALERTS BASED ON SEVERITY
// ------------------------------
function calculateNationalScore(alerts) {
    if (!alerts || alerts.length === 0) return 10;

    let totalScore = 0;

    alerts.forEach(alert => {
        const props = alert.properties || {};
        const event = (props.event || "").toLowerCase();
        const severity = (props.severity || "").toLowerCase();

        let weight = 0;

        // Base score by NWS Alert Severity
        if (severity === "extreme") weight += 25;
        else if (severity === "severe") weight += 15;
        else if (severity === "moderate") weight += 8;
        else if (severity === "minor") weight += 3;

        // Event-specific scoring
        if (event.includes("tornado")) weight += 30;
        if (event.includes("hurricane") || event.includes("typhoon")) weight += 35;
        if (event.includes("blizzard") || event.includes("ice storm")) weight += 20;
        if (event.includes("flash flood")) weight += 15;
        if (event.includes("fire") || event.includes("red flag")) weight += 10;

        totalScore += weight;
    });

    // Normalize raw score to a 0–200 scale
    const normalizedDOS = Math.min(Math.round(totalScore / 8), 200);
    return Math.max(normalizedDOS, 15);
}

function severityText(score) {
    if (score >= 150) return "High Impact — Severe Pattern";
    if (score >= 120) return "Moderate Impact — Active Weather";
    if (score >= 90)  return "Low Impact — Some Storms";
    if (score >= 50)  return "Quiet — Minimal Hazards";
    return "Calm — No Significant Threats";
}

// ------------------------------
// BUILD 7-DAY FORECAST
// ------------------------------
async function buildForecast() {
    const container = document.getElementById("forecastContainer");
    const alerts = await fetchActiveAlerts();

    if (!alerts) {
        container.innerHTML = "<p>Unable to retrieve live NWS data. Please try again shortly.</p>";
        return;
    }

    const baseScore = calculateNationalScore(alerts);
    const today = new Date();
    const daysOfWeek = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];

    const dosForecast = [];

    for (let i = 0; i < 7; i++) {
        const forecastDate = new Date();
        forecastDate.setDate(today.getDate() + i);

        const dayLabel = i === 0 ? "Today" : daysOfWeek[forecastDate.getDay()];
        
        // Simulates pattern progression across the 7-day outlook period
        const trendMultiplier = 1 + (Math.sin(i * 0.8) * 0.25);
        const projectedScore = Math.min(Math.max(Math.round(baseScore * trendMultiplier), 10), 200);

        dosForecast.push({
            day: dayLabel,
            score: projectedScore
        });
    }

    renderForecast(dosForecast);
}

// ------------------------------
// RENDER HTML
// ------------------------------
function renderForecast(dosForecast) {
    const container = document.getElementById("forecastContainer");
    container.innerHTML = "";

    dosForecast.forEach(item => {
        const card = document.createElement("div");
        card.className = "day-card";

        const dayName = document.createElement("div");
        dayName.className = "day-name";
        dayName.innerText = item.day;

        const dosValue = document.createElement("div");
        dosValue.className = "dos-value";
        dosValue.innerText = item.score;

        const dosLabel = document.createElement("div");
        dosLabel.className = "dos-label";
        dosLabel.innerText = severityText(item.score);

        if (item.score >= 120) dosLabel.classList.add("high-impact");

        const bar = document.createElement("div");
        bar.className = "bar";

        const barFill = document.createElement("div");
        barFill.className = "bar-fill";

        const maxScale = 200;
        barFill.style.width = (Math.min(item.score, maxScale) / maxScale * 100) + "%";

        bar.appendChild(barFill);
        card.appendChild(dayName);
        card.appendChild(dosValue);
        card.appendChild(dosLabel);
        card.appendChild(bar);

        container.appendChild(card);
    });
}

buildForecast();
</script>

</body>
</html>
