<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>USA 7-Day Jace Fink DOS & WIS Forecast</title>
<style>
    body { font-family: 'Segoe UI', Arial, sans-serif; background:#0d0d0d; color:#fff; padding:20px; }
    h1 { text-align:center; margin-bottom:5px; font-size:32px; }
    .subtitle { text-align:center; color:#888; font-size:14px; margin-bottom:20px; }
    
    /* Live Status Banner */
    .status-banner {
        background: #1c1c1c;
        border-radius: 12px;
        padding: 16px;
        max-width: 800px;
        margin: 0 auto 25px auto;
        display: flex;
        justify-content: space-between;
        align-items: center;
        box-shadow: 0 0 15px rgba(0,0,0,0.5);
    }
    .status-box { text-align: center; flex: 1; }
    .status-title { font-size: 12px; color: #888; text-transform: uppercase; margin-bottom: 4px; }
    .wis-val { font-size: 32px; font-weight: bold; color: #00ff77; }
    .stream-status { font-size: 18px; font-weight: bold; }
    .status-live { color: #ff0055; animation: pulse 1.5s infinite; }
    .status-standby { color: #ffaa00; }
    
    @keyframes pulse {
        0% { opacity: 1; }
        50% { opacity: 0.4; }
        100% { opacity: 1; }
    }

    .forecast-container { display:flex; flex-wrap:wrap; gap:18px; justify-content:center; }
    .day-card { background:#1c1c1c; padding:18px; border-radius:14px; width:200px;
                box-shadow:0 0 18px rgba(0,0,0,0.6); transition:transform .2s; }
    .day-card:hover { transform:scale(1.05); }
    .day-name { font-size:20px; text-align:center; margin-bottom:4px; font-weight:bold; }
    .day-date { font-size:12px; color:#777; text-align:center; margin-bottom:8px; }
    .dos-value { font-size:42px; font-weight:bold; text-align:center; margin-bottom:4px; }
    .dos-label { font-size:12px; text-align:center; opacity:.9; margin-bottom:8px; min-height:32px; line-height:1.3; }
    .video-label { font-size:11px; text-align:center; padding:4px 8px; border-radius:6px; background:#2a2a2a; margin-bottom:12px; }
    
    /* Ryan Hall Tier Styling */
    .tier-quiet { color: #00ff77; }
    .tier-active { color: #ffff00; }
    .tier-watch  { color: #ffaa00; }
    .tier-significant { color: #ff5500; }
    .tier-major { color: #ff0055; font-weight: bold; }
    .tier-extreme { color: #d400ff; font-weight: bold; }

    .bar { height:12px; background:#2a2a2a; border-radius:8px; overflow:hidden; }
    .bar-fill { height:100%; background:linear-gradient(90deg, #00ff77, #ffff00, #ffaa00, #ff0055, #d400ff);
                transition:width .8s; }
</style>
</head>
<body>

<h1>USA 7-Day Daily Outlook Score (DOS)</h1>
<div class="subtitle">Based on the Jace Fink National Weather Impact Index</div>

<!-- Live Status & WIS Header -->
<div class="status-banner">
    <div class="status-box">
        <div class="status-title">Current WIS Score</div>
        <div class="wis-val" id="currentWis">--</div>
    </div>
    <div class="status-box">
        <div class="status-title">Stream Status</div>
        <div class="stream-status" id="streamStatus">Checking status...</div>
    </div>
</div>

<div class="forecast-container" id="forecastContainer">Loading live NOAA hazard data...</div>

<script>

// User property to flag if currently live on YouTube
const IS_LIVE_ON_YOUTUBE = false; 

async function fetchActiveAlerts() {
    try {
        const response = await fetch("https://api.weather.gov/alerts/active");
        if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
        const data = await response.json();
        return data.features || [];
    } catch (err) {
        console.error("Failed to fetch NWS alerts:", err);
        return null;
    }
}

// Calculates Weather Intensity Score (WIS) & DOS from active NWS warnings
function calculateNationalScores(alerts) {
    if (!alerts || alerts.length === 0) return { wis: 15, dos: 15 };

    let rawScore = 0;

    alerts.forEach(alert => {
        const props = alert.properties || {};
        const event = (props.event || "").toLowerCase();
        const severity = (props.severity || "").toLowerCase();

        let points = 0;

        if (severity === "extreme") points += 20;
        else if (severity === "severe") points += 12;
        else if (severity === "moderate") points += 6;
        else if (severity === "minor") points += 2;

        if (event.includes("tornado")) points += 35;
        if (event.includes("hurricane") || event.includes("tropical storm")) points += 40;
        if (event.includes("blizzard") || event.includes("ice storm")) points += 25;
        if (event.includes("flash flood")) points += 18;
        if (event.includes("extreme wind") || event.includes("derecho")) points += 25;
        if (event.includes("red flag") || event.includes("fire")) points += 12;

        rawScore += points;
    });

    const currentWIS = Math.min(Math.round(rawScore / 8), 250);
    const baseDOS = Math.min(Math.round(rawScore / 10), 250);

    return {
        wis: Math.max(currentWIS, 10),
        dos: Math.max(baseDOS, 15)
    };
}

function getDOSMeta(score) {
    if (score >= 150) return { label: "Potentially Historic Setup", class: "tier-extreme" };
    if (score >= 125) return { label: "Extreme Event Potential", class: "tier-extreme" };
    if (score >= 110) return { label: "Major Weather Event Potential", class: "tier-major" };
    if (score >= 90)  return { label: "Significant Weather Likely", class: "tier-significant" };
    if (score >= 60)  return { label: "Weather Worth Watching", class: "tier-watch" };
    if (score >= 30)  return { label: "Some Weather Activity Expected", class: "tier-active" };
    return { label: "Mostly Quiet Nationally", class: "tier-quiet" };
}

function updateStreamStatus(wisScore) {
    const streamStatusEl = document.getElementById("streamStatus");
    const now = new Date();

    // Check if user is live on YouTube
    if (IS_LIVE_ON_YOUTUBE) {
        streamStatusEl.innerText = "LIVE NOW";
        streamStatusEl.className = "stream-status status-live";
        return;
    }

    // Specific logic for July 30, 2026
    const isTargetDate = (now.getFullYear() === 2026 && now.getMonth() === 6 && now.getDate() === 30);
    const threshold = isTargetDate ? 105 : 90;

    if (wisScore >= threshold) {
        streamStatusEl.innerText = "STREAM THRESHOLD MET";
        streamStatusEl.className = "stream-status status-live";
    } else {
        streamStatusEl.innerText = "Standing by until 5pm CDT";
        streamStatusEl.className = "stream-status status-standby";
    }
}

async function buildForecast() {
    const container = document.getElementById("forecastContainer");
    const alerts = await fetchActiveAlerts();

    if (!alerts) {
        container.innerHTML = "<p>Unable to retrieve live NWS data. Please try again shortly.</p>";
        return;
    }

    const { wis, dos } = calculateNationalScores(alerts);
    
    // Update WIS Header & Live Status
    document.getElementById("currentWis").innerText = wis;
    updateStreamStatus(wis);

    const today = new Date();
    const daysOfWeek = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
    const dosForecast = [];

    for (let i = 0; i < 7; i++) {
        const forecastDate = new Date();
        forecastDate.setDate(today.getDate() + i);

        const year = forecastDate.getFullYear();
        const month = forecastDate.getMonth() + 1; // 1-indexed
        const dateNum = forecastDate.getDate();

        const dayLabel = i === 0 ? "Today" : daysOfWeek[forecastDate.getDay()];
        const dateString = `${month}/${dateNum}/${year}`;

        // Video status schedule logic
        let videoLabel = "Video Unlikely";
        if (year === 2026 && month === 8 && dateNum === 5) {
            videoLabel = "Video Confirmed";
        } else if (year > 2026 || (year === 2026 && (month > 8 || (month === 8 && dateNum > 5)))) {
            videoLabel = "Video Unlikely";
        } else {
            videoLabel = "Video Unlikely";
        }

        const trendMultiplier = 1 + (Math.sin(i * 0.8) * 0.3);
        const projectedScore = Math.min(Math.max(Math.round(dos * trendMultiplier), 10), 250);

        dosForecast.push({
            day: dayLabel,
            dateStr: dateString,
            score: projectedScore,
            videoStatus: videoLabel,
            meta: getDOSMeta(projectedScore)
        });
    }

    renderForecast(dosForecast);
}

function renderForecast(dosForecast) {
    const container = document.getElementById("forecastContainer");
    container.innerHTML = "";

    dosForecast.forEach(item => {
        const card = document.createElement("div");
        card.className = "day-card";

        const dayName = document.createElement("div");
        dayName.className = "day-name";
        dayName.innerText = item.day;

        const dayDate = document.createElement("div");
        dayDate.className = "day-date";
        dayDate.innerText = item.dateStr;

        const dosValue = document.createElement("div");
        dosValue.className = "dos-value " + item.meta.class;
        dosValue.innerText = item.score;

        const dosLabel = document.createElement("div");
        dosLabel.className = "dos-label " + item.meta.class;
        dosLabel.innerText = item.meta.label;

        const videoTag = document.createElement("div");
        videoTag.className = "video-label";
        videoTag.innerText = item.videoStatus;
        if (item.videoStatus === "Video Confirmed") {
            videoTag.style.background = "#005522";
            videoTag.style.color = "#00ff77";
        }

        const bar = document.createElement("div");
        bar.className = "bar";

        const barFill = document.createElement("div");
        barFill.className = "bar-fill";
        const maxScale = 150;
        barFill.style.width = Math.min((item.score / maxScale) * 100, 100) + "%";

        bar.appendChild(barFill);
        card.appendChild(dayName);
        card.appendChild(dayDate);
        card.appendChild(dosValue);
        card.appendChild(dosLabel);
        card.appendChild(videoTag);
        card.appendChild(bar);

        container.appendChild(card);
    });
}

buildForecast();
</script>

</body>
</html>
