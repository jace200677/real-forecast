<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>USA 7-Day DOS Forecast</title>
<style>
    body { font-family: Arial; background:#0d0d0d; color:#fff; padding:20px; }
    h1 { text-align:center; margin-bottom:25px; font-size:32px; }
    .forecast-container { display:flex; flex-wrap:wrap; gap:18px; justify-content:center; }
    .day-card { background:#1c1c1c; padding:18px; border-radius:14px; width:190px;
                box-shadow:0 0 18px rgba(0,0,0,0.6); transition:transform .2s; }
    .day-card:hover { transform:scale(1.06); }
    .day-name { font-size:20px; text-align:center; margin-bottom:10px; }
    .dos-value { font-size:40px; font-weight:bold; text-align:center; margin-bottom:6px; }
    .dos-label { font-size:14px; text-align:center; opacity:.85; margin-bottom:12px; }
    .high-impact { color:#ff3b3b; font-weight:bold; }
    .bar { height:14px; background:#333; border-radius:8px; overflow:hidden; }
    .bar-fill { height:100%; background:linear-gradient(90deg,#00ff00,#ffff00,#ff8800,#ff0000,#b300ff);
                transition:width .8s; }
</style>
</head>
<body>

<h1>USA 7-Day Daily Outlook Score</h1>
<div class="forecast-container" id="forecastContainer"></div>

<script>

// ------------------------------
// FETCH REAL NWS HAZARD DATA
// ------------------------------

async function fetchHazards() {

    // SPC Convective Outlook (Day 1–3)
    const spc = await fetch("https://api.weather.gov/products/types/CONVOUTLOOK")
        .then(r => r.json()).catch(() => null);

    // WPC Excessive Rainfall Outlook
    const rainfall = await fetch("https://api.weather.gov/products/types/ERO")
        .then(r => r.json()).catch(() => null);

    // Winter Storm Severity Index
    const wssi = await fetch("https://api.weather.gov/gridpoints/MPX/47,37/wssi")
        .then(r => r.json()).catch(() => null);

    // Fire Weather
    const fire = await fetch("https://api.weather.gov/products/types/FWFE")
        .then(r => r.json()).catch(() => null);

    // Tropical Outlook
    const nhc = await fetch("https://api.weather.gov/products/types/TCV")
        .then(r => r.json()).catch(() => null);

    return { spc, rainfall, wssi, fire, nhc };
}

// ------------------------------
// RYAN HALL Y’ALL STYLE SCORING
// ------------------------------

function computeDOS(h) {

    let score = 0;

    // Severe storms (SPC)
    if (h.spc) score += 60;

    // Excessive rainfall
    if (h.rainfall) score += 40;

    // Winter storm severity
    if (h.wssi) score += 30;

    // Fire weather
    if (h.fire) score += 20;

    // Tropical threat
    if (h.nhc) score += 30;

    return Math.min(score, 200);
}

function severityText(score) {
    if (score >= 150) return "High Impact — Severe Pattern";
    if (score >= 120) return "Moderate Impact — Active Weather";
    if (score >= 90)  return "Low Impact — Some Storms";
    if (score >= 50)  return "Quiet — Minimal Hazards";
    return "Calm — No Significant Threats";
}

// ------------------------------
// BUILD 7-DAY FORECAST
// ------------------------------

async function buildForecast() {

    const hazards = await fetchHazards();

    const dosForecast = [];

    for (let i = 1; i <= 7; i++) {
        const score = computeDOS(hazards);
        dosForecast.push({ day: "Day " + i, score });
    }

    renderForecast(dosForecast);
}

// ------------------------------
// RENDER HTML
// ------------------------------

function renderForecast(dosForecast) {

    const container = document.getElementById("forecastContainer");

    dosForecast.forEach(item => {

        const card = document.createElement("div");
        card.className = "day-card";

        const dayName = document.createElement("div");
        dayName.className = "day-name";
        dayName.innerText = item.day;

        const dosValue = document.createElement("div");
        dosValue.className = "dos-value";
        dosValue.innerText = item.score;

        const dosLabel = document.createElement("div");
        dosLabel.className = "dos-label";
        dosLabel.innerText = severityText(item.score);

        if (item.score >= 150) dosLabel.classList.add("high-impact");

        const bar = document.createElement("div");
        bar.className = "bar";

        const barFill = document.createElement("div");
        barFill.className = "bar-fill";

        const maxScale = 150;
        barFill.style.width = (Math.min(item.score, maxScale) / maxScale * 100) + "%";

        bar.appendChild(barFill);
        card.appendChild(dayName);
        card.appendChild(dosValue);
        card.appendChild(dosLabel);
        card.appendChild(bar);

        container.appendChild(card);
    });
}

buildForecast();

</script>

</body>
</html>
