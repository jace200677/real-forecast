<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Summer Celebration Intensity</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(to bottom, #ffefba, #ffffff);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }

    h1 {
      margin-bottom: 10px;
    }

    #info {
      margin-bottom: 20px;
      font-size: 1rem;
    }

    .bar-container {
      width: 80%;
      max-width: 500px;
      height: 30px;
      border-radius: 15px;
      background: #eee;
      overflow: hidden;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    .bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #ff9800, #ff5722);
      transition: width 0.5s ease;
    }

    #percent {
      margin-top: 10px;
      font-size: 1.2rem;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <h1>Summer Celebration Surprise</h1>
  <div id="info">Intensity changes automatically based on the current time.</div>

  <div class="bar-container">
    <div class="bar-fill" id="barFill"></div>
  </div>
  <div id="percent">0%</div>

  <script>
    const peakHour = 20;      // 8:00 PM
    const peakMinute = 0;
    const endRampHour = 20;   // 8:15 PM
    const endRampMinute = 15;

    const peakIntensity = 88;

    function getCelebrationIntensity(date) {
      const h = date.getHours();
      const m = date.getMinutes();
      const nowMinutes = h * 60 + m;
      const peakMinutes = peakHour * 60 + peakMinute;
      const endRampMinutes = endRampHour * 60 + endRampMinute;

      // If before 8 PM → ramp up from now until 8 PM
      if (nowMinutes < peakMinutes) {
        const startMinutes = nowMinutes; // ramp starts NOW
        const totalRampUp = peakMinutes - startMinutes;
        const elapsed = nowMinutes - startMinutes;

        // Avoid divide-by-zero if exactly 8 PM
        if (totalRampUp <= 0) return peakIntensity;

        const intensity = (elapsed / totalRampUp) * peakIntensity;
        return intensity;
      }

      // At exactly 8 PM → peak 88%
      if (nowMinutes === peakMinutes) {
        return peakIntensity;
      }

      // Between 8 PM and 8:15 PM → ramp DOWN from 88% to 0%
      if (nowMinutes > peakMinutes && nowMinutes < endRampMinutes) {
        const totalRampDown = endRampMinutes - peakMinutes;
        const elapsed = nowMinutes - peakMinutes;

        const intensity = peakIntensity * (1 - (elapsed / totalRampDown));
        return intensity;
      }

      // After 8:15 PM → 0%
      if (nowMinutes >= endRampMinutes) {
        return 0;
      }

      return 0;
    }

    function updateBar() {
      const now = new Date();
      const intensity = getCelebrationIntensity(now);
      const bar = document.getElementById('barFill');
      const percentText = document.getElementById('percent');

      bar.style.width = intensity + '%';
      percentText.textContent = Math.round(intensity) + '%';
    }

    updateBar();
    setInterval(updateBar, 30 * 1000);
  </script>
</body>
</html>
