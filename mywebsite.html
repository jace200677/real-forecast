<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>USA 7-Day Weather Forecast</title>
<style>
    body { font-family: 'Segoe UI', Arial, sans-serif; background:#0d0d0d; color:#fff; padding:20px; margin: 0; }
    h1 { text-align:center; margin-bottom:5px; font-size:32px; }
    .subtitle { text-align:center; color:#888; font-size:14px; margin-bottom:20px; }
    
    /* Search Bar Styles */
    .search-container {
        display: flex;
        justify-content: center;
        gap: 10px;
        max-width: 800px;
        margin: 0 auto 20px auto;
    }
    .search-input {
        padding: 10px 14px;
        border-radius: 8px;
        border: 1px solid #333;
        background: #1c1c1c;
        color: #fff;
        font-size: 14px;
        width: 60%;
        outline: none;
    }
    .search-input:focus { border-color: #0088ff; }
    .search-button {
        padding: 10px 20px;
        border-radius: 8px;
        border: none;
        background: #0088ff;
        color: #fff;
        font-weight: bold;
        cursor: pointer;
        transition: background 0.2s;
    }
    .search-button:hover { background: #0066cc; }

    /* Live Status Banner */
    .status-banner {
        background: #1c1c1c;
        border-radius: 12px;
        padding: 16px;
        max-width: 800px;
        margin: 0 auto 25px auto;
        display: flex;
        justify-content: space-between;
        align-items: center;
        box-shadow: 0 0 15px rgba(0,0,0,0.5);
    }
    .status-box { text-align: center; flex: 1; }
    .status-title { font-size: 12px; color: #888; text-transform: uppercase; margin-bottom: 4px; }
    .wis-val { font-size: 24px; font-weight: bold; color: #0088ff; }
    .stream-status { font-size: 18px; font-weight: bold; }
    .status-live { color: #ff0055; animation: pulse 1.5s infinite; }
    .status-standby { color: #ffaa00; }
    .status-off { color: #888888; }
    
    @keyframes pulse {
        0% { opacity: 1; }
        50% { opacity: 0.4; }
        100% { opacity: 1; }
    }

    .forecast-container { display:flex; flex-wrap:wrap; gap:18px; justify-content:center; }
    .day-card { background:#1c1c1c; padding:18px; border-radius:14px; width:220px;
                box-shadow:0 0 18px rgba(0,0,0,0.6); transition:transform .2s; }
    .day-card:hover { transform:scale(1.05); }
    .day-name { font-size:20px; text-align:center; margin-bottom:2px; font-weight:bold; }
    .day-date { font-size:12px; color:#777; text-align:center; margin-bottom:12px; }
    .temp-value { font-size:32px; font-weight:bold; text-align:center; margin-bottom:4px; color: #0088ff; }
    .weather-short { font-size:13px; text-align:center; font-weight: 600; margin-bottom:8px; min-height:32px; line-height:1.2; color: #e0e0e0; }
    
    .wind-label { font-size:11px; text-align:center; padding:4px 6px; border-radius:6px; background:#2a2a2a; margin-bottom:10px; color: #aaa; }
    .detailed-desc { font-size: 11px; color: #888; line-height: 1.3; text-align: center; margin-top: 8px; border-top: 1px solid #2a2a2a; padding-top: 8px; }
</style>
</head>
<body>

<h1>USA 7-Day Weather Forecast</h1>
<div class="subtitle">Live NWS Local Weather Data</div>

<!-- Location Search UI -->
<div class="search-container">
    <input type="text" id="locationInput" class="search-input" placeholder="Enter Location or City (e.g. Minneapolis, MN)">
    <button onclick="searchLocationForecast()" class="search-button">Get 7 Day Forecast</button>
</div>

<!-- Live Status Header -->
<div class="status-banner">
    <div class="status-box">
        <div class="status-title">Current Location</div>
        <div class="wis-val" id="currentLocation">National Overview</div>
    </div>
    <div class="status-box">
        <div class="status-title">Stream Status</div>
        <div class="stream-status" id="streamStatus">Checking status...</div>
    </div>
</div>

<div class="forecast-container" id="forecastContainer">Loading live NOAA weather data...</div>

<script>
const IS_LIVE_ON_YOUTUBE = false; 
let targetZoneOrPoint = { lat: "44.9778", lon: "-93.2650" }; // Default: Minneapolis

async function searchLocationForecast() {
    const query = document.getElementById("locationInput").value.trim();
    if (!query) return;

    const container = document.getElementById("forecastContainer");
    container.innerHTML = "Searching location and fetching 7-day forecast...";

    try {
        const geoUrl = `https://nominatim.openstreetmap.org/search?format=json&countrycodes=us&q=${encodeURIComponent(query)}`;
        const geoRes = await fetch(geoUrl);
        const geoData = await geoRes.json();

        if (geoData && geoData.length > 0) {
            const lat = parseFloat(geoData[0].lat).toFixed(4);
            const lon = parseFloat(geoData[0].lon).toFixed(4);
            targetZoneOrPoint = { lat, lon };
            document.getElementById("currentLocation").innerText = geoData[0].display_name.split(',')[0];
            buildForecast();
        } else {
            container.innerHTML = "<p>Location not found. Please try again with a valid US city or zip code.</p>";
        }
    } catch (err) {
        console.error("Geocoding failed:", err);
        buildForecast();
    }
}

async function fetchWeatherForecast() {
    try {
        // Step 1: Get gridpoint endpoint
        const pointUrl = `https://api.weather.gov/points/${targetZoneOrPoint.lat},${targetZoneOrPoint.lon}`;
        const pointRes = await fetch(pointUrl);
        if (!pointRes.ok) throw new Error("Failed to fetch point data");
        const pointData = await pointRes.json();
        
        // Step 2: Fetch actual 7-day daily forecast periods
        const forecastUrl = pointData.properties.forecast;
        const forecastRes = await fetch(forecastUrl);
        if (!forecastRes.ok) throw new Error("Failed to fetch forecast data");
        const forecastData = await forecastRes.json();
        
        return forecastData.properties.periods || [];
    } catch (err) {
        console.error("Failed to fetch NWS forecast:", err);
        return null;
    }
}

function updateStreamStatus() {
    const streamStatusEl = document.getElementById("streamStatus");

    if (IS_LIVE_ON_YOUTUBE) {
        streamStatusEl.innerText = "LIVE NOW";
        streamStatusEl.className = "stream-status status-live";
        return;
    }

    const now = new Date();
    const cdtOptions = { timeZone: 'America/Chicago', year: 'numeric', month: 'numeric', day: 'numeric', hour: 'numeric', minute: 'numeric', hour12: false };
    const cdtParts = new Intl.DateTimeFormat('en-US', cdtOptions).formatToParts(now);
    
    let year, month, day, hour;
    cdtParts.forEach(part => {
        if (part.type === 'year') year = parseInt(part.value, 10);
        if (part.type === 'month') month = parseInt(part.value, 10);
        if (part.type === 'day') day = parseInt(part.value, 10);
        if (part.type === 'hour') hour = parseInt(part.value, 10);
    });

    if (year === 2026 && month === 7 && day === 31) {
        if (hour >= 13 && hour < 21) {
            streamStatusEl.innerText = "LIVE NOW";
            streamStatusEl.className = "stream-status status-live";
        } else if (hour < 13) {
            streamStatusEl.innerText = "Standing by for MN Storms";
            streamStatusEl.className = "stream-status status-standby";
        } else {
            streamStatusEl.innerText = "NOT STREAMING";
            streamStatusEl.className = "stream-status status-off";
        }
    } else {
        streamStatusEl.innerText = "NOT STREAMING";
        streamStatusEl.className = "stream-status status-off";
    }
}

async function buildForecast() {
    const container = document.getElementById("forecastContainer");
    const periods = await fetchWeatherForecast();

    if (!periods || periods.length === 0) {
        container.innerHTML = "<p>Unable to retrieve live NWS weather data. Please try again shortly.</p>";
        return;
    }

    updateStreamStatus();

    // Group forecast daytime periods for a 7-day display
    const dayPeriods = periods.filter(p => p.isDaytime).slice(0, 7);
    renderForecast(dayPeriods);
}

function renderForecast(periods) {
    const container = document.getElementById("forecastContainer");
    container.innerHTML = "";

    periods.forEach(item => {
        const card = document.createElement("div");
        card.className = "day-card";

        const dayName = document.createElement("div");
        dayName.className = "day-name";
        dayName.innerText = item.name;

        const tempVal = document.createElement("div");
        tempVal.className = "temp-value";
        tempVal.innerText = `${item.temperature}°${item.temperatureUnit}`;

        const shortForecast = document.createElement("div");
        shortForecast.className = "weather-short";
        shortForecast.innerText = item.shortForecast;

        const windTag = document.createElement("div");
        windTag.className = "wind-label";
        windTag.innerText = `Wind: ${item.windDirection} ${item.windSpeed}`;

        const detailedDesc = document.createElement("div");
        detailedDesc.className = "detailed-desc";
        detailedDesc.innerText = item.detailedForecast;

        card.appendChild(dayName);
        card.appendChild(tempVal);
        card.appendChild(shortForecast);
        card.appendChild(windTag);
        card.appendChild(detailedDesc);

        container.appendChild(card);
    });
}

// Run forecast on page load
buildForecast();
</script>

</body>
</html>
