<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NOAA 7-Day USA Weather Outlook</title>
<style>
    body {
        font-family: Arial, sans-serif;
        background: #0d0d0d;
        color: #fff;
        padding: 20px;
    }

    h1 {
        text-align: center;
        margin-bottom: 25px;
        font-size: 32px;
        letter-spacing: 1px;
    }

    .forecast-container {
        display: flex;
        flex-wrap: wrap;
        gap: 18px;
        justify-content: center;
    }

    .day-card {
        background: #1c1c1c;
        padding: 18px;
        border-radius: 14px;
        width: 240px;
        box-shadow: 0 0 18px rgba(0,0,0,0.6);
        transition: transform 0.2s ease;
    }

    .day-card:hover {
        transform: scale(1.06);
    }

    .day-name {
        font-size: 20px;
        margin-bottom: 10px;
        text-align: center;
    }

    .hazard {
        margin-bottom: 8px;
        font-size: 15px;
        padding: 6px;
        border-radius: 6px;
        background: #2a2a2a;
    }

    .severe { background: #b30000; }
    .flood { background: #0066ff; }
    .winter { background: #9999ff; }
    .heat { background: #ff6600; }
    .quiet { background: #333; }
</style>
</head>
<body>

<h1>NOAA 7-Day USA Weather Outlook</h1>

<div class="forecast-container" id="forecastContainer"></div>

<script>
    // Replace these with REAL NOAA hazard data
    const noaaOutlook = [
        { day: "Day 1", hazards: ["Severe Thunderstorms", "Flooding"] },
        { day: "Day 2", hazards: ["Severe Thunderstorms"] },
        { day: "Day 3", hazards: ["Winter Storm", "Flooding"] },
        { day: "Day 4", hazards: ["Heat Risk"] },
        { day: "Day 5", hazards: ["Quiet Weather"] },
        { day: "Day 6", hazards: ["Flooding"] },
        { day: "Day 7", hazards: ["Quiet Weather"] }
    ];

    function classify(hazard) {
        if (hazard.includes("Severe")) return "severe";
        if (hazard.includes("Flood")) return "flood";
        if (hazard.includes("Winter")) return "winter";
        if (hazard.includes("Heat")) return "heat";
        return "quiet";
    }

    const container = document.getElementById("forecastContainer");

    noaaOutlook.forEach(item => {
        const card = document.createElement("div");
        card.className = "day-card";

        const dayName = document.createElement("div");
        dayName.className = "day-name";
        dayName.innerText = item.day;

        card.appendChild(dayName);

        item.hazards.forEach(h => {
            const hazardBox = document.createElement("div");
            hazardBox.className = "hazard " + classify(h);
            hazardBox.innerText = h;
            card.appendChild(hazardBox);
        });

        container.appendChild(card);
    });
</script>

</body>
</html>
