<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Summer Celebration Intensity</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(to bottom, #ffefba, #ffffff);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }

    h1 {
      margin-bottom: 10px;
    }

    #info {
      margin-bottom: 20px;
      font-size: 1rem;
    }

    .bar-container {
      width: 80%;
      max-width: 500px;
      height: 30px;
      border-radius: 15px;
      background: #eee;
      overflow: hidden;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    .bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #ff9800, #ff5722);
      transition: width 0.5s ease;
    }

    #percent {
      margin-top: 10px;
      font-size: 1.2rem;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <h1>Summer Celebration Surprise</h1>
  <div id="info">Intensity updates live without reloading.</div>

  <div class="bar-container">
    <div class="bar-fill" id="barFill"></div>
  </div>
  <div id="percent">0%</div>

  <script>
    const peakHour = 20;      // 8:00 PM
    const peakMinute = 0;
    const endRampHour = 20;   // 8:15 PM
    const endRampMinute = 15;

    const startIntensity = 75;   // starting now
    const peakIntensity = 88;    // at 8 PM

    // Capture the moment the page loads — ramp starts NOW
    const startTime = new Date();

    function getCelebrationIntensity(date) {
      const nowMinutes = date.getHours() * 60 + date.getMinutes();
      const peakMinutes = peakHour * 60 + peakMinute;
      const endRampMinutes = endRampHour * 60 + endRampMinute;

      const startMinutes = startTime.getHours() * 60 + startTime.getMinutes();

      // Before 8 PM → ramp UP from 75% to 88%
      if (nowMinutes < peakMinutes) {
        const totalRampUp = peakMinutes - startMinutes;
        const elapsed = nowMinutes - startMinutes;

        const progress = Math.max(0, Math.min(elapsed / totalRampUp, 1));
        return startIntensity + (peakIntensity - startIntensity) * progress;
      }

      // At exactly 8 PM → peak 88%
      if (nowMinutes === peakMinutes) {
        return peakIntensity;
      }

      // Between 8 PM and 8:15 PM → ramp DOWN from 88% to 0%
      if (nowMinutes > peakMinutes && nowMinutes < endRampMinutes) {
        const totalRampDown = endRampMinutes - peakMinutes;
        const elapsed = nowMinutes - peakMinutes;

        const progress = Math.max(0, Math.min(elapsed / totalRampDown, 1));
        return peakIntensity * (1 - progress);
      }

      // After 8:15 PM → 0%
      return 0;
    }

    function updateBar() {
      const now = new Date();
      const intensity = getCelebrationIntensity(now);

      const bar = document.getElementById('barFill');
      const percentText = document.getElementById('percent');

      bar.style.width = intensity + '%';
      percentText.textContent = Math.round(intensity) + '%';
    }

    updateBar();
    setInterval(updateBar, 1000); // update every second
  </script>
</body>
</html>
