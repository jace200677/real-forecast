<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>USA 7-Day Jace Fink DOS & WIS Forecast</title>
<style>
    body { font-family: 'Segoe UI', Arial, sans-serif; background:#0d0d0d; color:#fff; padding:20px; }
    h1 { text-align:center; margin-bottom:5px; font-size:32px; }
    .subtitle { text-align:center; color:#888; font-size:14px; margin-bottom:20px; }
    
    /* Live Status Banner */
    .status-banner {
        background: #1c1c1c;
        border-radius: 12px;
        padding: 16px;
        max-width: 800px;
        margin: 0 auto 25px auto;
        display: flex;
        justify-content: space-between;
        align-items: center;
        box-shadow: 0 0 15px rgba(0,0,0,0.5);
    }
    .status-box { text-align: center; flex: 1; }
    .status-title { font-size: 12px; color: #888; text-transform: uppercase; margin-bottom: 4px; }
    .wis-val { font-size: 32px; font-weight: bold; }
    .stream-status { font-size: 18px; font-weight: bold; }
    .status-live { color: #ff0055; animation: pulse 1.5s infinite; }
    .status-standby { color: #ffaa00; }
    
    @keyframes pulse {
        0% { opacity: 1; }
        50% { opacity: 0.4; }
        100% { opacity: 1; }
    }

    .forecast-container { display:flex; flex-wrap:wrap; gap:18px; justify-content:center; }
    .day-card { background:#1c1c1c; padding:18px; border-radius:14px; width:210px;
                box-shadow:0 0 18px rgba(0,0,0,0.6); transition:transform .2s; }
    .day-card:hover { transform:scale(1.05); }
    .day-name { font-size:20px; text-align:center; margin-bottom:2px; font-weight:bold; }
    .day-date { font-size:12px; color:#777; text-align:center; margin-bottom:8px; }
    .dos-value { font-size:38px; font-weight:bold; text-align:center; margin-bottom:2px; }
    .dos-label { font-size:11px; text-align:center; opacity:.9; margin-bottom:8px; min-height:28px; line-height:1.2; }
    
    .video-label { font-size:11px; text-align:center; padding:3px 6px; border-radius:6px; background:#2a2a2a; margin-bottom:8px; }
    
    /* Live Stream Chance Section */
    .stream-chance-container { margin-top: 10px; font-size: 11px; text-align: center; }
    .stream-chance-title { color: #aaa; text-transform: uppercase; letter-spacing: 0.5px; font-size: 10px; }
    .stream-chance-val { font-size: 14px; font-weight: bold; color: #0088ff; margin-bottom: 4px; }

    /* Progress Bars */
    .bar-label { font-size: 9px; color: #666; text-transform: uppercase; margin-bottom: 2px; }
    .bar { height:8px; background:#2a2a2a; border-radius:6px; overflow:hidden; margin-bottom: 8px; }
    .bar-fill { height:100%; transition: width .8s, background-color .8s; }
    .bar-fill-stream { height:100%; background: #0088ff; transition: width .8s; }
</style>
</head>
<body>

<h1>USA 7-Day Daily Outlook Score (DOS)</h1>
<div class="subtitle">Based on the Jace Fink National Weather Impact Index</div>

<!-- Live Status & WIS Header -->
<div class="status-banner">
    <div class="status-box">
        <div class="status-title">Current WIS Score</div>
        <div class="wis-val" id="currentWis">--</div>
    </div>
    <div class="status-box">
        <div class="status-title">Stream Status</div>
        <div class="stream-status" id="streamStatus">Checking status...</div>
    </div>
</div>

<div class="forecast-container" id="forecastContainer">Loading live NOAA hazard data...</div>

<script>

const IS_LIVE_ON_YOUTUBE = false; 

async function fetchActiveAlerts() {
    try {
        const response = await fetch("https://api.weather.gov/alerts/active");
        if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
        const data = await response.json();
        return data.features || [];
    } catch (err) {
        console.error("Failed to fetch NWS alerts:", err);
        return null;
    }
}

// Color Lerp Helper: Interpolates RGB values based on score thresholds
function getLerpColor(score) {
    const stops = [
        { score: 0,   r: 0,   g: 255, b: 119 }, // #00ff77 Green
        { score: 30,  r: 255, g: 255, b: 0 },   // #ffff00 Yellow
        { score: 60,  r: 255, g: 170, b: 0 },   // #ffaa00 Orange
        { score: 90,  r: 255, g: 0,   b: 85 },  // #ff0055 Red
        { score: 120, r: 212, g: 0,   b: 255 }  // #d400ff Purple
    ];

    if (score <= stops[0].score) return `rgb(${stops[0].r}, ${stops[0].g}, ${stops[0].b})`;
    if (score >= stops[stops.length - 1].score) {
        const last = stops[stops.length - 1];
        return `rgb(${last.r}, ${last.g}, ${last.b})`;
    }

    let i = 0;
    while (score > stops[i + 1].score) {
        i++;
    }

    const lower = stops[i];
    const upper = stops[i + 1];
    const factor = (score - lower.score) / (upper.score - lower.score);

    const r = Math.round(lower.r + factor * (upper.r - lower.r));
    const g = Math.round(lower.g + factor * (upper.g - lower.g));
    const b = Math.round(lower.b + factor * (upper.b - lower.b));

    return `rgb(${r}, ${g}, ${b})`;
}

// Further reduced national score calculation
function calculateNationalScores(alerts) {
    if (!alerts || alerts.length === 0) return { wis: 3, dos: 4 };

    let rawScore = 0;

    alerts.forEach(alert => {
        const props = alert.properties || {};
        const event = (props.event || "").toLowerCase();
        const severity = (props.severity || "").toLowerCase();

        let points = 0;

        if (severity === "extreme") points += 3;
        else if (severity === "severe") points += 1.5;
        else if (severity === "moderate") points += 0.5;
        else if (severity === "minor") points += 0.1;

        if (event.includes("tornado")) points += 5;
        if (event.includes("hurricane") || event.includes("tropical storm")) points += 6;
        if (event.includes("blizzard") || event.includes("ice storm")) points += 3;
        if (event.includes("flash flood")) points += 2;
        if (event.includes("extreme wind") || event.includes("derecho")) points += 3;
        if (event.includes("red flag") || event.includes("fire")) points += 1;

        rawScore += points;
    });

    // Scaled down significantly so typical quiet days sit around 2–15 range
    const currentWIS = Math.min(Math.round(rawScore / 45), 250);
    const baseDOS = Math.min(Math.round(rawScore / 55), 250);

    return {
        wis: Math.max(currentWIS, 2),
        dos: Math.max(baseDOS, 3)
    };
}

function getDOSMeta(score) {
    if (score >= 150) return { label: "Potentially Historic Setup" };
    if (score >= 125) return { label: "Extreme Event Potential" };
    if (score >= 110) return { label: "Major Weather Event Potential" };
    if (score >= 90)  return { label: "Significant Weather Likely" };
    if (score >= 60)  return { label: "Weather Worth Watching" };
    if (score >= 30)  return { label: "Some Weather Activity Expected" };
    return { label: "Mostly Quiet Nationally" };
}

function updateStreamStatus(wisScore) {
    const streamStatusEl = document.getElementById("streamStatus");

    if (IS_LIVE_ON_YOUTUBE) {
        streamStatusEl.innerText = "LIVE NOW";
        streamStatusEl.className = "stream-status status-live";
        return;
    }

    if (wisScore >= 50) {
        streamStatusEl.innerText = "STREAM THRESHOLD MET";
        streamStatusEl.className = "stream-status status-live";
    } else {
        streamStatusEl.innerText = "Standing by until 5pm CDT";
        streamStatusEl.className = "stream-status status-standby";
    }
}

async function buildForecast() {
    const container = document.getElementById("forecastContainer");
    const alerts = await fetchActiveAlerts();

    if (!alerts) {
        container.innerHTML = "<p>Unable to retrieve live NWS data. Please try again shortly.</p>";
        return;
    }

    const { wis, dos } = calculateNationalScores(alerts);
    
    // Update WIS Header with lerp color
    const wisEl = document.getElementById("currentWis");
    wisEl.innerText = wis;
    wisEl.style.color = getLerpColor(wis);
    
    updateStreamStatus(wis);

    const today = new Date();
    const daysOfWeek = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
    const dosForecast = [];

    for (let i = 0; i < 7; i++) {
        const forecastDate = new Date();
        forecastDate.setDate(today.getDate() + i);

        const year = forecastDate.getFullYear();
        const month = forecastDate.getMonth() + 1;
        const dateNum = forecastDate.getDate();

        const dayLabel = i === 0 ? "Today" : daysOfWeek[forecastDate.getDay()];
        const dateString = `${month}/${dateNum}/${year}`;

        let projectedScore;
        let streamChance;
        
        // Explicit logic for 8/6/26
        if (year === 2026 && month === 8 && dateNum === 6) {
            projectedScore = 200;
            streamChance = 100; // 100% live stream chance on 8/6/26
        } else {
            const trendMultiplier = 1 + (Math.sin(i * 0.8) * 0.2);
            projectedScore = Math.min(Math.max(Math.round(dos * trendMultiplier), 2), 150);
            
            // Calculate proportional live stream chance (capped for lower score days)
            streamChance = Math.min(Math.round((projectedScore / 90) * 100), 85);
            if (streamChance < 5) streamChance = 0;
        }

        // Video status logic: 8/5/26 set to Video Unlikely
        let videoLabel = "Video Unlikely";

        dosForecast.push({
            day: dayLabel,
            dateStr: dateString,
            score: projectedScore,
            streamChance: streamChance,
            videoStatus: videoLabel,
            meta: getDOSMeta(projectedScore)
        });
    }

    renderForecast(dosForecast);
}

function renderForecast(dosForecast) {
    const container = document.getElementById("forecastContainer");
    container.innerHTML = "";

    dosForecast.forEach(item => {
        const card = document.createElement("div");
        card.className = "day-card";

        const dynamicColor = getLerpColor(item.score);

        const dayName = document.createElement("div");
        dayName.className = "day-name";
        dayName.innerText = item.day;

        const dayDate = document.createElement("div");
        dayDate.className = "day-date";
        dayDate.innerText = item.dateStr;

        const dosValue = document.createElement("div");
        dosValue.className = "dos-value";
        dosValue.innerText = item.score;
        dosValue.style.color = dynamicColor;

        const dosLabel = document.createElement("div");
        dosLabel.className = "dos-label";
        dosLabel.innerText = item.meta.label;
        dosLabel.style.color = dynamicColor;

        const videoTag = document.createElement("div");
        videoTag.className = "video-label";
        videoTag.innerText = item.videoStatus;

        // DOS Bar
        const barLabel = document.createElement("div");
        barLabel.className = "bar-label";
        barLabel.innerText = "DOS Score Bar";

        const bar = document.createElement("div");
        bar.className = "bar";

        const barFill = document.createElement("div");
        barFill.className = "bar-fill";
        barFill.style.backgroundColor = dynamicColor;
        const maxScale = 120;
        barFill.style.width = Math.min((item.score / maxScale) * 100, 100) + "%";
        bar.appendChild(barFill);

        // Live Stream Chance Section
        const streamContainer = document.createElement("div");
        streamContainer.className = "stream-chance-container";

        const streamTitle = document.createElement("div");
        streamTitle.className = "stream-chance-title";
        streamTitle.innerText = "Live Stream Chance";

        const streamVal = document.createElement("div");
        streamVal.className = "stream-chance-val";
        streamVal.innerText = item.streamChance + "%";

        const streamBar = document.createElement("div");
        streamBar.className = "bar";

        const streamBarFill = document.createElement("div");
        streamBarFill.className = "bar-fill-stream";
        streamBarFill.style.width = item.streamChance + "%";

        streamBar.appendChild(streamBarFill);
        streamContainer.appendChild(streamTitle);
        streamContainer.appendChild(streamVal);
        streamContainer.appendChild(streamBar);

        // Assemble Card
        card.appendChild(dayName);
        card.appendChild(dayDate);
        card.appendChild(dosValue);
        card.appendChild(dosLabel);
        card.appendChild(videoTag);
        card.appendChild(barLabel);
        card.appendChild(bar);
        card.appendChild(streamContainer);

        container.appendChild(card);
    });
}

buildForecast();
</script>

</body>
</html>
