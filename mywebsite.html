<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>USA 7-Day Jace Fink DOS & WIS Forecast</title>
<style>
    body { font-family: 'Segoe UI', Arial, sans-serif; background:#0d0d0d; color:#fff; padding:20px; margin: 0; }
    h1 { text-align:center; margin-bottom:5px; font-size:32px; }
    .subtitle { text-align:center; color:#888; font-size:14px; margin-bottom:20px; }
    
    /* Search Bar Styles */
    .search-container {
        display: flex;
        justify-content: center;
        gap: 10px;
        max-width: 800px;
        margin: 0 auto 20px auto;
    }
    .search-input {
        padding: 10px 14px;
        border-radius: 8px;
        border: 1px solid #333;
        background: #1c1c1c;
        color: #fff;
        font-size: 14px;
        width: 60%;
        outline: none;
    }
    .search-input:focus { border-color: #0088ff; }
    .search-button {
        padding: 10px 20px;
        border-radius: 8px;
        border: none;
        background: #0088ff;
        color: #fff;
        font-weight: bold;
        cursor: pointer;
        transition: background 0.2s;
    }
    .search-button:hover { background: #0066cc; }

    /* Live Status Banner */
    .status-banner {
        background: #1c1c1c;
        border-radius: 12px;
        padding: 16px;
        max-width: 800px;
        margin: 0 auto 25px auto;
        display: flex;
        justify-content: space-between;
        align-items: center;
        box-shadow: 0 0 15px rgba(0,0,0,0.5);
    }
    .status-box { text-align: center; flex: 1; }
    .status-title { font-size: 12px; color: #888; text-transform: uppercase; margin-bottom: 4px; }
    .wis-val { font-size: 32px; font-weight: bold; }
    .stream-status { font-size: 18px; font-weight: bold; }
    .status-live { color: #ff0055; animation: pulse 1.5s infinite; }
    .status-standby { color: #ffaa00; }
    .status-off { color: #888888; }
    
    @keyframes pulse {
        0% { opacity: 1; }
        50% { opacity: 0.4; }
        100% { opacity: 1; }
    }

    .forecast-container { display:flex; flex-wrap:wrap; gap:18px; justify-content:center; }
    .day-card { background:#1c1c1c; padding:18px; border-radius:14px; width:220px;
                box-shadow:0 0 18px rgba(0,0,0,0.6); transition:transform .2s; }
    .day-card:hover { transform:scale(1.05); }
    .day-name { font-size:20px; text-align:center; margin-bottom:2px; font-weight:bold; }
    .day-date { font-size:12px; color:#777; text-align:center; margin-bottom:8px; }
    .dos-value { font-size:38px; font-weight:bold; text-align:center; margin-bottom:2px; }
    .dos-label { font-size:11px; text-align:center; opacity:.9; margin-bottom:8px; min-height:28px; line-height:1.2; }
    
    .weather-summary { font-size: 11px; text-align: center; color: #bbb; min-height: 24px; margin-bottom: 8px; font-style: italic; }
    .video-label { font-size:11px; text-align:center; padding:3px 6px; border-radius:6px; background:#2a2a2a; margin-bottom:8px; }
    .dinner-label { font-size:11px; text-align:center; padding:4px 6px; border-radius:6px; background:#1b3320; color:#4ade80; font-weight:bold; margin-bottom:8px; }

    /* Weather Stats Data Labels & Ranges */
    .stat-row { display: flex; justify-content: space-between; font-size: 10px; color: #aaa; margin-top: 6px; margin-bottom: 2px; }
    .stat-val { font-weight: bold; color: #fff; }

    /* Live Stream Chance Section */
    .stream-chance-container { margin-top: 10px; font-size: 11px; text-align: center; }
    .stream-chance-title { color: #aaa; text-transform: uppercase; letter-spacing: 0.5px; font-size: 10px; }
    .stream-chance-val { font-size: 14px; font-weight: bold; color: #0088ff; margin-bottom: 4px; }

    /* Progress Bars */
    .bar-label { font-size: 9px; color: #666; text-transform: uppercase; margin-bottom: 2px; }
    .bar { height:8px; background:#2a2a2a; border-radius:6px; overflow:hidden; margin-bottom: 6px; position: relative; }
    .bar-fill { height:100%; transition: width .5s, background-color .5s; }
    .bar-fill-stream { height:100%; background: #0088ff; transition: width .5s; }
    
    /* Range Bar Fill Style */
    .range-bar-fill { position: absolute; height: 100%; border-radius: 6px; transition: all .5s; }
</style>
</head>
<body>

<h1>USA 7-Day Daily Outlook Score (DOS)</h1>
<div class="subtitle">Based on the Jace Fink National Weather Impact Index</div>

<!-- Location Search UI -->
<div class="search-container">
    <input type="text" id="locationInput" class="search-input" placeholder="Enter Location or City (e.g. Minneapolis, MN)">
    <button onclick="searchLocationForecast()" class="search-button">Get 7 Day Forecast</button>
</div>

<!-- Live Status & WIS Header -->
<div class="status-banner">
    <div class="status-box">
        <div class="status-title">Current WIS Score</div>
        <div class="wis-val" id="currentWis">--</div>
    </div>
    <div class="status-box">
        <div class="status-title">Stream Status</div>
        <div class="stream-status" id="streamStatus">Checking status...</div>
    </div>
</div>

<div class="forecast-container" id="forecastContainer">Loading live NOAA hazard data...</div>

<script>
const IS_LIVE_ON_YOUTUBE = false; 
let targetZoneOrPoint = null;
let currentSearchState = null; // Stores state code if searched

// Dinner Menu Calculation Engine (2 days Pizza, 2 days Chicken Nuggets cycle, hidden in June & July)
function getDinnerMenu(dateObj) {
    const month = dateObj.getMonth() + 1; // 1-12
    
    // Hide dinner menu during June (6) and July (7)
    if (month === 6 || month === 7) {
        return null;
    }

    // Anchor calculation starting from today (Day 1 Pizza, Day 2 Pizza, Day 3 & 4 Nuggets)
    const today = new Date();
    today.setHours(0, 0, 0, 0);
    
    const target = new Date(dateObj);
    target.setHours(0, 0, 0, 0);

    const diffDays = Math.round((target - today) / (1000 * 60 * 60 * 24));
    
    // 4-day repeating cycle logic starting today at index 0 (Day 1 Pizza)
    const cycleIndex = ((diffDays % 4) + 4) % 4;

    if (cycleIndex === 0 || cycleIndex === 1) {
        return "Pizza";
    } else {
        return "Chicken Nuggets";
    }
}

async function searchLocationForecast() {
    const query = document.getElementById("locationInput").value.trim();
    if (!query) return;

    const container = document.getElementById("forecastContainer");
    container.innerHTML = "Searching location and calculating forecast...";

    try {
        const geoUrl = `https://nominatim.openstreetmap.org/search?format=json&addressdetails=1&countrycodes=us&q=${encodeURIComponent(query)}`;
        const geoRes = await fetch(geoUrl);
        const geoData = await geoRes.json();

        if (geoData && geoData.length > 0) {
            const lat = parseFloat(geoData[0].lat).toFixed(4);
            const lon = parseFloat(geoData[0].lon).toFixed(4);
            targetZoneOrPoint = { lat, lon };
            
            // Track state for MN specific overrides
            const address = geoData[0].address || {};
            currentSearchState = address.state ? address.state.toLowerCase() : null;
            
            buildForecast();
        } else {
            container.innerHTML = "<p>Location not found. Please try again with a valid US city or zip code.</p>";
        }
    } catch (err) {
        console.error("Geocoding failed:", err);
        buildForecast();
    }
}

async function fetchActiveAlerts() {
    try {
        let url = "https://api.weather.gov/alerts/active";
        if (targetZoneOrPoint) {
            url = `https://api.weather.gov/alerts/active?point=${targetZoneOrPoint.lat},${targetZoneOrPoint.lon}`;
        }
        const response = await fetch(url);
        if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
        const data = await response.json();
        return data.features || [];
    } catch (err) {
        console.error("Failed to fetch NWS alerts:", err);
        return null;
    }
}

async function fetchLocalForecastGrid() {
    if (!targetZoneOrPoint) return null;
    try {
        const pointRes = await fetch(`https://api.weather.gov/points/${targetZoneOrPoint.lat},${targetZoneOrPoint.lon}`);
        if (!pointRes.ok) return null;
        const pointData = await pointRes.json();
        const forecastUrl = pointData.properties?.forecast;
        if (!forecastUrl) return null;

        const forecastRes = await fetch(forecastUrl);
        if (!forecastRes.ok) return null;
        const forecastData = await forecastRes.json();
        return forecastData.properties?.periods || [];
    } catch (err) {
        console.error("Failed to fetch grid forecast:", err);
        return null;
    }
}

function getLerpColor(score) {
    const stops = [
        { score: 0,   r: 0,   g: 255, b: 119 },
        { score: 30,  r: 255, g: 255, b: 0 },
        { score: 60,  r: 255, g: 170, b: 0 },
        { score: 90,  r: 255, g: 0,   b: 85 },
        { score: 120, r: 212, g: 0,   b: 255 }
    ];

    if (score <= stops[0].score) return `rgb(${stops[0].r}, ${stops[0].g}, ${stops[0].b})`;
    if (score >= stops[stops.length - 1].score) {
        const last = stops[stops.length - 1];
        return `rgb(${last.r}, ${last.g}, ${last.b})`;
    }

    let i = 0;
    while (score > stops[i + 1].score) i++;

    const lower = stops[i];
    const upper = stops[i + 1];
    const factor = (score - lower.score) / (upper.score - lower.score);

    const r = Math.round(lower.r + factor * (upper.r - lower.r));
    const g = Math.round(lower.g + factor * (upper.g - lower.g));
    const b = Math.round(lower.b + factor * (upper.b - lower.b));

    return `rgb(${r}, ${g}, ${b})`;
}

// Apple Weather Exact Temperature Color Scale (-20°F to 110°F+)
function getTempColor(tempF) {
    const stops = [
        { temp: -20, r: 160, g: 130, b: 255 }, // Dark Purple (Extreme Cold)
        { temp: 0,   r: 96,  g: 165, b: 250 }, // Soft Cyan Blue
        { temp: 32,  r: 52,  g: 199, b: 89  }, // Apple Green (Freezing Threshold)
        { temp: 50,  r: 255, g: 204, b: 0  }, // Bright Yellow
        { temp: 70,  r: 255, g: 149, b: 0  }, // Orange
        { temp: 90,  r: 255, g: 59,  b: 48  }, // Bright Red
        { temp: 110, r: 175, g: 30,  b: 45  }  // Deep Wine Red/Magenta
    ];
    if (tempF <= stops[0].temp) return `rgb(${stops[0].r}, ${stops[0].g}, ${stops[0].b})`;
    if (tempF >= stops[stops.length - 1].temp) {
        const last = stops[stops.length - 1];
        return `rgb(${last.r}, ${last.g}, ${last.b})`;
    }
    let i = 0;
    while (tempF > stops[i + 1].temp) i++;
    const lower = stops[i];
    const upper = stops[i + 1];
    const factor = (tempF - lower.temp) / (upper.temp - lower.temp);
    const r = Math.round(lower.r + factor * (upper.r - lower.r));
    const g = Math.round(lower.g + factor * (upper.g - lower.g));
    const b = Math.round(lower.b + factor * (upper.b - lower.b));
    return `rgb(${r}, ${g}, ${b})`;
}

// Apple Weather Wind & Gust Speed Color Scale (0 to 80+ mph)
function getWindColor(mph) {
    const stops = [
        { speed: 0,  r: 142, g: 142, b: 147 }, // Apple System Gray (Calm)
        { speed: 12, r: 52,  g: 199, b: 89  }, // Green (Gentle)
        { speed: 25, r: 255, g: 204, b: 0  }, // Yellow (Breezy / Moderate)
        { speed: 40, r: 255, g: 149, b: 0  }, // Orange (High Wind)
        { speed: 58, r: 255, g: 59,  b: 48  }, // Red (Severe / Damaging Wind)
        { speed: 75, r: 175, g: 82,  b: 222 }  // Purple (Extreme / Hurricane Force)
    ];
    if (mph <= stops[0].speed) return `rgb(${stops[0].r}, ${stops[0].g}, ${stops[0].b})`;
    if (mph >= stops[stops.length - 1].speed) {
        const last = stops[stops.length - 1];
        return `rgb(${last.r}, ${last.g}, ${last.b})`;
    }
    let i = 0;
    while (mph > stops[i + 1].speed) i++;
    const lower = stops[i];
    const upper = stops[i + 1];
    const factor = (mph - lower.speed) / (upper.speed - lower.speed);
    const r = Math.round(lower.r + factor * (upper.r - lower.r));
    const g = Math.round(lower.g + factor * (upper.g - lower.g));
    const b = Math.round(lower.b + factor * (upper.b - lower.b));
    return `rgb(${r}, ${g}, ${b})`;
}

// Enhanced WIS and DOS calculation accounting for Volume, PDS/Emergency Tags, and Severity
function calculateNationalScores(alerts) {
    if (!alerts || alerts.length === 0) return { wis: 3, dos: 4 };

    let rawWisScore = 0;
    let highRiskBaseline = 0;

    alerts.forEach(alert => {
        const props = alert.properties || {};
        const event = (props.event || "").toLowerCase();
        const severity = (props.severity || "").toLowerCase();
        const headline = (props.headline || "").toLowerCase();
        const description = (props.description || "").toLowerCase();

        let points = 0;
        
        // 1. Severity Multipliers
        if (severity === "extreme") points += 4.0;
        else if (severity === "severe") points += 2.0;
        else if (severity === "moderate") points += 0.8;
        else if (severity === "minor") points += 0.2;

        // 2. Alert Types
        if (event.includes("tornado")) points += 6;
        if (event.includes("hurricane") || event.includes("tropical storm")) points += 7;
        if (event.includes("blizzard") || event.includes("ice storm")) points += 3.5;
        if (event.includes("flash flood")) points += 2.5;
        if (event.includes("extreme wind") || event.includes("derecho")) points += 4;
        if (event.includes("red flag") || event.includes("fire")) points += 1;

        // 3. High-Impact Tags (PDS, Tornado Emergency, Destructive)
        const fullText = headline + " " + description;
        if (fullText.includes("tornado emergency")) {
            points += 50; // Massively boosts WIS score
        } else if (fullText.includes("particularly dangerous situation") || fullText.includes("pds")) {
            points += 20;
        }
        
        if (fullText.includes("destructive")) {
            points += 10;
        }

        // SPC Risk baseline weight estimation
        if (event.includes("tornado watch") || event.includes("severe thunderstorm watch")) {
            highRiskBaseline += 5;
        }

        rawWisScore += points;
    });

    const currentWIS = Math.min(Math.round(rawWisScore / 40), 250);
    const baseDOS = Math.min(Math.round((rawWisScore + highRiskBaseline) / 48), 250);

    return {
        wis: Math.max(currentWIS, 2),
        dos: Math.max(baseDOS, 3)
    };
}

function getDOSMeta(score) {
    if (score >= 150) return { label: "Potentially Historic Setup" };
    if (score >= 125) return { label: "Extreme Event Potential" };
    if (score >= 110) return { label: "Major Weather Event Potential" };
    if (score >= 90)  return { label: "Significant Weather Likely" };
    if (score >= 60)  return { label: "Weather Worth Watching" };
    if (score >= 30)  return { label: "Some Weather Activity Expected" };
    return { label: "Mostly Quiet Nationally" };
}

function updateStreamStatus(wisScore) {
    const streamStatusEl = document.getElementById("streamStatus");

    if (IS_LIVE_ON_YOUTUBE) {
        streamStatusEl.innerText = "LIVE NOW";
        streamStatusEl.className = "stream-status status-live";
        return;
    }

    const now = new Date();
    const cdtOptions = { timeZone: 'America/Chicago', year: 'numeric', month: 'numeric', day: 'numeric', hour: 'numeric', minute: 'numeric', hour12: false };
    const cdtParts = new Intl.DateTimeFormat('en-US', cdtOptions).formatToParts(now);
    
    let year, month, day, hour;
    cdtParts.forEach(part => {
        if (part.type === 'year') year = parseInt(part.value, 10);
        if (part.type === 'month') month = parseInt(part.value, 10);
        if (part.type === 'day') day = parseInt(part.value, 10);
        if (part.type === 'hour') hour = parseInt(part.value, 10);
    });

    if (year === 2026 && month === 7 && day === 31) {
        if (hour >= 13 && hour < 21) {
            streamStatusEl.innerText = "LIVE NOW";
            streamStatusEl.className = "stream-status status-live";
        } else if (hour < 13) {
            streamStatusEl.innerText = "Standing by for MN Storms";
            streamStatusEl.className = "stream-status status-standby";
        } else {
            streamStatusEl.innerText = "NOT STREAMING";
            streamStatusEl.className = "stream-status status-off";
        }
    } else {
        streamStatusEl.innerText = "NOT STREAMING";
        streamStatusEl.className = "stream-status status-off";
    }
}

// Generates dynamic scores based on hours and minutes
function getDynamicScores73126() {
    const now = new Date();
    const minutes = now.getMinutes();
    const hours = now.getHours();

    const timeFactor = (hours * 60 + minutes);
    const fluctuation = Math.sin(timeFactor / 15) * 4; 

    const basePeak = 52;
    const projectedScore = Math.min(Math.max(Math.round(basePeak + fluctuation), 10), 56);

    const streamFluctuation = Math.cos(timeFactor / 12) * 5;
    const baseChance = 95;
    const streamChance = Math.min(Math.max(Math.round(baseChance + streamFluctuation), 0), 100);

    return { projectedScore, streamChance };
}

async function buildForecast() {
    const container = document.getElementById("forecastContainer");
    const alerts = await fetchActiveAlerts();
    const gridPeriods = await fetchLocalForecastGrid();

    if (!alerts) {
        container.innerHTML = "<p>Unable to retrieve live NWS data. Please try again shortly.</p>";
        return;
    }

    const { wis, dos } = calculateNationalScores(alerts);
    
    const wisEl = document.getElementById("currentWis");
    wisEl.innerText = wis;
    wisEl.style.color = getLerpColor(wis);
    
    updateStreamStatus(wis);

    const today = new Date();
    today.setHours(0, 0, 0, 0);
    const daysOfWeek = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
    const dosForecast = [];

    for (let i = 0; i < 7; i++) {
        const forecastDate = new Date();
        forecastDate.setDate(today.getDate() + i);

        const year = forecastDate.getFullYear();
        const month = forecastDate.getMonth() + 1;
        const dateNum = forecastDate.getDate();

        const dayLabel = i === 0 ? "Today" : daysOfWeek[forecastDate.getDay()];
        const dateString = `${month}/${dateNum}/${year}`;

        let projectedScore;
        let streamChance;
        
        // Custom scenario dates override
        if (year === 2026 && month === 7 && dateNum === 31) {
            const dynamicData = getDynamicScores73126();
            projectedScore = dynamicData.projectedScore;
            streamChance = dynamicData.streamChance;
        } else if (year === 2026 && month === 8 && dateNum === 6) {
            projectedScore = 200;
            streamChance = 100;
        } else if (year === 2026 && month === 8 && dateNum === 28) {
            // --- BASE OVERRIDE DOS VALUE OF 93 FOR 8/28/2026 ADJUSTED BY LAT/LON & TIME PROXIMITY ---
            const targetDate = new Date(2026, 7, 28);
            targetDate.setHours(0, 0, 0, 0);
            const daysOut = Math.max(0, Math.round((targetDate - today) / (1000 * 60 * 60 * 24)));

            const lat = targetZoneOrPoint ? parseFloat(targetZoneOrPoint.lat) : 45.0;
            const lon = targetZoneOrPoint ? parseFloat(targetZoneOrPoint.lon) : -93.0;

            const latOffset = (lat - 45.0) * 2.5;
            const lonOffset = (lon + 93.0) * 1.8;

            const varianceAmplitude = daysOut * 1.5; 
            const swingFactor = Math.sin(daysOut * 1.2);

            const baseDos93 = 93;
            projectedScore = Math.max(5, Math.round(baseDos93 + latOffset + lonOffset + (swingFactor * varianceAmplitude)));
            
            streamChance = Math.min(Math.round((projectedScore / 90) * 100), 95);
        } else {
            const trendMultiplier = 1 + (Math.sin(i * 0.8) * 0.2);
            projectedScore = Math.min(Math.max(Math.round(dos * trendMultiplier), 2), 150);
            
            streamChance = Math.min(Math.round((projectedScore / 90) * 100), 85);
            if (streamChance < 5) streamChance = 0;
        }

        let videoLabel = streamChance > 70 ? "Video Likely" : "Video Unlikely";

        // Extract 7-day weather stats (Temp High/Low, Wind, Gust)
        let weatherSummary = "National Outlook Only";
        let tempLow = 50 + (i * 2);
        let tempHigh = 72 + (i * 2);
        let windMph = 8 + (i * 2);
        let gustMph = windMph + 12;

        if (gridPeriods && gridPeriods.length > 0) {
            const dayPeriods = gridPeriods.filter(p => {
                const pDate = new Date(p.startTime).getDate();
                return pDate === dateNum;
            });

            if (dayPeriods.length > 0) {
                const temps = dayPeriods.map(p => p.temperature);
                tempHigh = Math.max(...temps);
                tempLow = Math.min(...temps);
                if (tempHigh === tempLow) tempLow = tempHigh - 12;

                const firstPeriod = dayPeriods[0];
                weatherSummary = `${firstPeriod.shortForecast}`;

                // Parse wind speed
                const windMatch = firstPeriod.windSpeed ? firstPeriod.windSpeed.match(/\d+/) : null;
                if (windMatch) windMph = parseInt(windMatch[0], 10);
                gustMph = windMph + Math.round(windMph * 0.4) + 5;
            }
        }

        // --- DYNAMIC MINNESOTA OVERRIDE FOR 8/28/2026 WITH GEOGRAPHIC & CONFIDENCE-BASED VARIANCE ---
        if (year === 2026 && month === 8 && dateNum === 28) {
            const isMN = currentSearchState === "minnesota" || currentSearchState === "mn";
            if (isMN) {
                // Days remaining until target event date (8/28/2026)
                const targetDate = new Date(2026, 7, 28);
                targetDate.setHours(0, 0, 0, 0);
                const daysOut = Math.max(0, Math.round((targetDate - today) / (1000 * 60 * 60 * 24)));

                // Spatial factors based on Lat/Lon relative to Central Minnesota (45.0 N, -93.0 W)
                const lat = targetZoneOrPoint ? parseFloat(targetZoneOrPoint.lat) : 45.0;
                const lon = targetZoneOrPoint ? parseFloat(targetZoneOrPoint.lon) : -93.0;

                const latOffset = (lat - 45.0) * 1.5;
                const lonOffset = (lon + 93.0) * 1.2;

                // Establish base override values adjusted for Geographic Coordinates
                const baseLow = 37 - latOffset + lonOffset;
                const baseHigh = 65 - latOffset + (lonOffset * 1.5);
                const baseWind = 28 + latOffset;
                const baseGust = 62 + (latOffset * 1.5);

                // Confidence Variance: As daysOut decreases (gets closer), variance shrinks towards confidence.
                // Dynamic oscillation creates natural up/down forecast swings further out.
                const varianceAmplitude = daysOut * 1.2; 
                const swingFactor = Math.sin(daysOut * 1.5);

                tempLow = Math.round(baseLow + (swingFactor * varianceAmplitude));
                tempHigh = Math.round(baseHigh + (swingFactor * varianceAmplitude * 1.3));
                windMph = Math.max(5, Math.round(baseWind + (swingFactor * varianceAmplitude * 0.8)));
                gustMph = Math.max(windMph + 5, Math.round(baseGust + (swingFactor * varianceAmplitude * 1.5)));

                if (!gridPeriods || gridPeriods.length === 0) {
                    weatherSummary = "Cool & High Winds";
                }
            }
        }

        // Calculate Dinner Menu
        const dinnerMenu = getDinnerMenu(forecastDate);

        dosForecast.push({
            day: dayLabel,
            dateStr: dateString,
            score: projectedScore,
            streamChance: streamChance,
            videoStatus: videoLabel,
            dinnerMenu: dinnerMenu,
            weatherSummary: weatherSummary,
            tempLow: tempLow,
            tempHigh: tempHigh,
            windMph: windMph,
            gustMph: gustMph,
            meta: getDOSMeta(projectedScore)
        });
    }

    renderForecast(dosForecast);
}

function renderForecast(dosForecast) {
    const container = document.getElementById("forecastContainer");
    container.innerHTML = "";

    dosForecast.forEach(item => {
        const card = document.createElement("div");
        card.className = "day-card";

        const dynamicColor = getLerpColor(item.score);

        const dayName = document.createElement("div");
        dayName.className = "day-name";
        dayName.innerText = item.day;

        const dayDate = document.createElement("div");
        dayDate.className = "day-date";
        dayDate.innerText = item.dateStr;

        const dosValue = document.createElement("div");
        dosValue.className = "dos-value";
        dosValue.innerText = item.score;
        dosValue.style.color = dynamicColor;

        const dosLabel = document.createElement("div");
        dosLabel.className = "dos-label";
        dosLabel.innerText = item.meta.label;
        dosLabel.style.color = dynamicColor;

        const weatherSummary = document.createElement("div");
        weatherSummary.className = "weather-summary";
        weatherSummary.innerText = item.weatherSummary;

        const videoTag = document.createElement("div");
        videoTag.className = "video-label";
        videoTag.innerText = item.videoStatus;

        // DOS Score Bar
        const barLabel = document.createElement("div");
        barLabel.className = "bar-label";
        barLabel.innerText = "DOS Score Bar";

        const bar = document.createElement("div");
        bar.className = "bar";

        const barFill = document.createElement("div");
        barFill.className = "bar-fill";
        barFill.style.backgroundColor = dynamicColor;
        const maxScale = 120;
        barFill.style.width = Math.min((item.score / maxScale) * 100, 100) + "%";
        bar.appendChild(barFill);

        // --- TEMPERATURE RANGE BAR (Apple Weather Low to High Gradient) ---
        const tempStatRow = document.createElement("div");
        tempStatRow.className = "stat-row";
        tempStatRow.innerHTML = `<span>Temp Range</span><span class="stat-val">${item.tempLow}°F - ${item.tempHigh}°F</span>`;

        const tempBar = document.createElement("div");
        tempBar.className = "bar";

        const tempRangeFill = document.createElement("div");
        tempRangeFill.className = "range-bar-fill";
        
        const minTempScale = -10;
        const totalTempSpan = 120;
        const lowPercent = Math.max(0, Math.min(100, ((item.tempLow - minTempScale) / totalTempSpan) * 100));
        const highPercent = Math.max(0, Math.min(100, ((item.tempHigh - minTempScale) / totalTempSpan) * 100));
        
        const lowColor = getTempColor(item.tempLow);
        const highColor = getTempColor(item.tempHigh);

        tempRangeFill.style.left = lowPercent + "%";
        tempRangeFill.style.width = Math.max(5, (highPercent - lowPercent)) + "%";
        tempRangeFill.style.background = `linear-gradient(90deg, ${lowColor}, ${highColor})`;
        tempBar.appendChild(tempRangeFill);

        // --- SUSTAINED WIND MPH BAR (Apple Weather Dynamic Range 0 to Current Wind Speed) ---
        const windStatRow = document.createElement("div");
        windStatRow.className = "stat-row";
        const windColor = getWindColor(item.windMph);
        windStatRow.innerHTML = `<span>Wind Speed</span><span class="stat-val" style="color:${windColor}">${item.windMph} mph</span>`;

        const windBar = document.createElement("div");
        windBar.className = "bar";

        const windRangeFill = document.createElement("div");
        windRangeFill.className = "range-bar-fill";
        
        const minWindScale = 0;
        const maxWindScale = 60;
        const windHighPercent = Math.min(100, Math.max(5, (item.windMph / maxWindScale) * 100));
        const windStartColor = getWindColor(minWindScale);

        windRangeFill.style.left = "0%";
        windRangeFill.style.width = windHighPercent + "%";
        windRangeFill.style.background = `linear-gradient(90deg, ${windStartColor}, ${windColor})`;
        windBar.appendChild(windRangeFill);

        // --- WIND GUST MPH BAR (Apple Weather Dynamic Range 0 to Current Gust Speed) ---
        const gustStatRow = document.createElement("div");
        gustStatRow.className = "stat-row";
        const gustColor = getWindColor(item.gustMph);
        gustStatRow.innerHTML = `<span>Wind Gust</span><span class="stat-val" style="color:${gustColor}">${item.gustMph} mph</span>`;

        const gustBar = document.createElement("div");
        gustBar.className = "bar";

        const gustRangeFill = document.createElement("div");
        gustRangeFill.className = "range-bar-fill";
        
        const maxGustScale = 75;
        const gustHighPercent = Math.min(100, Math.max(5, (item.gustMph / maxGustScale) * 100));
        const gustStartColor = getWindColor(0);

        gustRangeFill.style.left = "0%";
        gustRangeFill.style.width = gustHighPercent + "%";
        gustRangeFill.style.background = `linear-gradient(90deg, ${gustStartColor}, ${gustColor})`;
        gustBar.appendChild(gustRangeFill);

        // Live Stream Chance
        const streamContainer = document.createElement("div");
        streamContainer.className = "stream-chance-container";

        const streamTitle = document.createElement("div");
        streamTitle.className = "stream-chance-title";
        streamTitle.innerText = "Live Stream Chance";

        const streamVal = document.createElement("div");
        streamVal.className = "stream-chance-val";
        streamVal.innerText = item.streamChance + "%";

        const streamBar = document.createElement("div");
        streamBar.className = "bar";

        const streamBarFill = document.createElement("div");
        streamBarFill.className = "bar-fill-stream";
        streamBarFill.style.width = item.streamChance + "%";

        streamBar.appendChild(streamBarFill);
        streamContainer.appendChild(streamTitle);
        streamContainer.appendChild(streamVal);
        streamContainer.appendChild(streamBar);

        // Appending element hierarchy
        card.appendChild(dayName);
        card.appendChild(dayDate);
        card.appendChild(dosValue);
        card.appendChild(dosLabel);
        card.appendChild(weatherSummary);
        card.appendChild(videoTag);

        // Render Dinner Menu tag if applicable (hidden in June & July)
        if (item.dinnerMenu) {
            const dinnerTag = document.createElement("div");
            dinnerTag.className = "dinner-label";
            dinnerTag.innerText = "Dinner: " + item.dinnerMenu;
            card.appendChild(dinnerTag);
        }
        
        card.appendChild(barLabel);
        card.appendChild(bar);
        
        card.appendChild(tempStatRow);
        card.appendChild(tempBar);
        card.appendChild(windStatRow);
        card.appendChild(windBar);
        card.appendChild(gustStatRow);
        card.appendChild(gustBar);

        card.appendChild(streamContainer);

        container.appendChild(card);
    });
}

// Run forecast on page load
buildForecast();
</script>

</body>
</html>
