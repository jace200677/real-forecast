<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Summer Celebration Intensity</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(to bottom, #ffefba, #ffffff);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }

    h1 {
      margin-bottom: 10px;
    }

    #info {
      margin-bottom: 20px;
      font-size: 1rem;
    }

    .bar-container {
      width: 80%;
      max-width: 500px;
      height: 30px;
      border-radius: 15px;
      background: #eee;
      overflow: hidden;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    .bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #ff9800, #ff5722);
      transition: width 0.5s ease;
    }

    #percent {
      margin-top: 10px;
      font-size: 1.2rem;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <h1>Summer Celebration Surprise</h1>
  <div id="info">Intensity updates live without reloading.</div>

  <div class="bar-container">
    <div class="bar-fill" id="barFill"></div>
  </div>
  <div id="percent">0%</div>

  <script>
    const startIntensity = 75;     // at 7:30 PM
    const peakIntensity = 88;      // at 8:00 PM

    // Fixed timeline
    function getTimeStamp(h, m) {
      const now = new Date();
      return new Date(now.getFullYear(), now.getMonth(), now.getDate(), h, m).getTime();
    }

    const rampStart = getTimeStamp(19, 30);  // 7:30 PM
    const rampPeak  = getTimeStamp(20, 0);   // 8:00 PM
    const rampEnd   = getTimeStamp(20, 15);  // 8:15 PM

    function getCelebrationIntensity() {
      const now = Date.now();

      // Before 7:30 PM → hold at 75%
      if (now < rampStart) {
        return startIntensity;
      }

      // 7:30 PM → 8:00 PM → ramp UP 75% → 88%
      if (now >= rampStart && now < rampPeak) {
        const total = rampPeak - rampStart;
        const elapsed = now - rampStart;
        const progress = elapsed / total;
        return startIntensity + (peakIntensity - startIntensity) * progress;
      }

      // Exactly 8:00 PM → 88%
      if (now === rampPeak) {
        return peakIntensity;
      }

      // 8:00 PM → 8:15 PM → ramp DOWN 88% → 0%
      if (now > rampPeak && now < rampEnd) {
        const total = rampEnd - rampPeak;
        const elapsed = now - rampPeak;
        const progress = elapsed / total;
        return peakIntensity * (1 - progress);
      }

      // After 8:15 PM → 0%
      return 0;
    }

    function updateBar() {
      const intensity = getCelebrationIntensity();
      const bar = document.getElementById('barFill');
      const percentText = document.getElementById('percent');

      bar.style.width = intensity + '%';
      percentText.textContent = Math.round(intensity) + '%';
    }

    updateBar();
    setInterval(updateBar, 1000); // update every second
  </script>
</body>
</html>
